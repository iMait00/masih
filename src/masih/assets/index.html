<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ماسح</title>
<style>
/* ============================================================
   خطوط قرآنية مرفقة مع البرنامج، يقدّمها الخادم المحلي.
   Amiri Quran مصمَّم للرسم العثماني: يركّب الألف الخنجرية
   والتنوين المزدوج وعلامات الوقف تركيباً صحيحاً.
   لا شيء يُحمَّل من الإنترنت، فالبرنامج يعمل كاملاً بلا اتصال.
   ============================================================ */
@font-face{
  font-family:'Amiri Quran'; font-style:normal; font-weight:400; font-display:swap;
  src:url('/fonts/AmiriQuran-Regular.woff2') format('woff2');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFC;
}
@font-face{
  font-family:'Amiri'; font-style:normal; font-weight:400; font-display:swap;
  src:url('/fonts/Amiri-Regular.ttf') format('truetype');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFC;
}
@font-face{
  font-family:'Amiri'; font-style:normal; font-weight:700; font-display:swap;
  src:url('/fonts/Amiri-Bold.ttf') format('truetype');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFC;
}
:root{
  --quran-font:"Amiri Quran","KFGQPC Uthman Taha Naskh","KFGQPC HAFS Uthmanic Script",
               "me_quran","Al Qalam Quran Majeed","Scheherazade New","Amiri",
               "Traditional Arabic",serif;
}

/* ============================================================
   لوح الألوان.

   خمسة أزرق يتدرّج من قاع البحر إلى الأفق، وكريميٌّ هو لون الورق،
   وذهبٌ بثلاث درجات للتذهيب. وهو لوح المخطوط لا لوح لوحة تحكّم:
   الزُرقة للصدَفة والحبر، والكريمي للأرضية التي يُقرأ عليها،
   والذهب للمسطرة والشعار وحدهما — فإن كثر الذهب صار زخرفاً.
   ============================================================ */
:root{
  --abyss:#05102D;      /* أزرق سحيق — الصدَفة والقاع */
  --night:#1A2444;      /* أزرق ليلي — الأسطح المرتفعة */
  --marine:#2A468B;     /* أزرق بحري — الأساسي */
  --horizon:#3D6AC1;    /* أزرق الأفق — التفاعل واللمس */
  --cream:#FFF7E3;      /* أبيض كريمي — الورق والحرف على الغامق */
  --gold:#B89343;
  --gold-2:#CDB178;
  --gold-3:#DFCBA7;
  /* الذهب خطٌّ ومسطرة، فإن صار حرفاً مقروءاً على الكريمي احتاج
     غمقاً: ‎#B89343‎ عليه لا يبلغ نسبة تباين مقبولة */
  --gold-ink:#8A6A24;
}

/* ===== الوضع الفاتح (الافتراضي) ===== */
:root{
  --panel:#FFFBF2;
  --panel-2:#F7F0DF;
  --panel-3:#EEE5D0;
  --edge:#E4DAC2;
  --edge-2:#CBBEA0;
  --fg:#0E1A34;
  --fg-2:#4B5878;
  --fg-3:#8B93AC;
  --desk:#E7DDC5;

  /* الورقة ثابتة بيضاء في الوضعين: المعاينة تعِد بمطابقة ملف الـ PDF،
     وملفّ الـ PDF أبيض. فتبقى بيضاء ويُصبَغ المكتب من حولها. */
  --paper:#ffffff;
  --paper-ink:#15171c;
  --paper-2:#f7f5ef;
  --paper-line:#d7cfbc;

  --ui:#2A468B;             /* لون الحرف والحدّ في العناصر التفاعلية */
  --ui-fill:#2A468B;        /* تعبئة الزرّ الرئيسي */
  --ui-on:#FFF7E3;          /* الحرف فوق التعبئة */
  --ui-hot:#3D6AC1;         /* المرور واللمس */
  --ui-soft:rgba(42,70,139,.10);
  --ok:#1B6B4A;
  --warn:#8E6412;
  --doc-accent:#2A468B;

  /* الصدَفة العليا: غامقة في الوضعين، فهي إطار البرنامج لا ورقته */
  --chrome:#05102D;
  --chrome-fg:#FFF7E3;
  --chrome-fg-2:rgba(255,247,227,.60);
  --chrome-edge:rgba(255,247,227,.14);

  --display:"Amiri","Sakkal Majalla","Traditional Arabic","Simplified Arabic",serif;
  --sans:"Segoe UI","Segoe UI Arabic",-apple-system,Tahoma,sans-serif;
  --r:10px;
  --r-lg:14px;               /* نصف قطر اللوحات والمودالات */
  --r-sm:8px;                /* نصف قطر العناصر الصغيرة */
  --bar:52px;               /* ارتفاع الصدَفة العليا — واحد في العمودين */
  --tools:392px;
  /* ظلٌّ مصمت بطبقتين يحلّ محل الحدّ: طبقة قريبة حادّة تُلامس السطح،
     وطبقة بعيدة ناعمة تمنحه ارتفاعاً — لا خطّ يفصله عمّا تحته */
  --sh-1:0 1px 2px rgba(5,16,45,.08), 0 6px 16px -8px rgba(5,16,45,.22);
  --sh-2:0 2px 6px rgba(5,16,45,.12), 0 14px 34px -12px rgba(5,16,45,.35);
  --sh-3:0 3px 10px rgba(5,16,45,.16), 0 24px 56px -16px rgba(5,16,45,.45);
}
/* ============================================================
   الوضع الغامق.

   كان أزرقَ صريحاً في أسطحه كلّها — تشبُّعُ لوحِ الأدوات يقارب
   نصفَ المدى وقاعُه فوق ذلك — فيخرج البرنامج بمظهر لوحةِ تحكّمٍ
   مضاءة لا بمظهر أداةٍ يُشتغل عليها ساعات. والزُرقةُ إن غلبت على
   السطح صرخت، وإن خفتت صارت أرضاً يقوم عليها غيرُها.

   فخُفض التشبّع إلى نحو الثُمن في الأسطح كلّها، وبقيت الدرجةُ
   اللونية على حالها (‎224‎) فلم تُفقد هويّةُ البرنامج: رمادٌ فيه
   مسحةُ أزرق، لا أزرقُ فيه مسحةُ رماد. والزرقةُ الصريحة انحصرت
   حيث تفيد — العناصرُ التفاعلية وحدها — فصار الأزرقُ إشارةً
   تُقرأ لأنها قليلة، بعد أن كان أرضاً لا تدلّ على شيء.

   والحبر كريميٌّ كما كان، وتباينُه على الأسطح كلّها فوق ‎10:1‎.
   والذهب يبقى إشارةً وفواصل، لا لوناً للحبر أصلاً.

   والورقة تبقى بيضاء في الوضعين: البرنامج يعِد بمطابقة الملف المطبوع،
   والملف أبيض. فتُبقى الورقةُ ورقةً ويُصبَغ ما حولها.
   ============================================================ */
body.dark{
  --panel:#20232A;              /* لوح الأدوات — رمادٌ فيه مسحةُ ليل */
  --panel-2:#2B2F38;            /* اللوح المرتفع (البطاقات وحقول الإدخال) */
  --panel-3:#373C48;            /* اللمسة (الحوم على العناصر) */
  --edge:#404554;               /* حدّ رقيق يفصل ولا يقطع */
  --edge-2:#575F75;             /* حدّ محسوس (المُختار، الحاسم) */
  --fg:#FFF7E3;                 /* الحبر: كريميّ لا أبيضَ فيؤذي */
  --fg-2:#C5C9D3;               /* الحبر الثاني — واضح بلا أن يصرخ */
  --fg-3:#8E94A4;
  --desk:#121419;               /* المكتب حول الورقة — أدكنُ ما في اللوح */

  /* الزرقةُ الصريحة هنا وحدها: ما يُنقر ويُلمس، فيدلّ لونُه عليه */
  --ui:#97B2D8;                 /* الحرف والحدّ في العناصر التفاعلية */
  --ui-fill:#476DAE;            /* تعبئة الزرّ الرئيسي */
  --ui-on:#FFF7E3;
  --ui-hot:#B0C7E8;             /* المرور: أفتحُ لا أدكن */
  --ui-soft:rgba(151,178,216,.13);
  --ok:#7ED5A6;
  --warn:#E5C05F;
  --gold-ink:#DFCBA7;           /* ذهبٌ فاتح للنص، فالغامق يغرق */
  --paper-2:#f7f5ef;

  /* الصدَفة العليا أفتح قليلاً من المكتب، بلا نتوء عن اللوح */
  --chrome:#181B22;
  --chrome-fg:#FFF7E3;
  --chrome-fg-2:rgba(255,247,227,.65);
  --chrome-edge:rgba(255,247,227,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--desk); color:var(--fg);
  font-family:var(--sans);
  font-size:14px; line-height:1.6; overflow:hidden;
  display:flex; flex-direction:row;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit}
/* حلقة تركيز مصمتة بدل الحدّ الخطّي: ظلٌّ واضح يحيط بالعنصر دون
   أن يرسم إطاراً حوله في حاله المعتادة */
:focus-visible{outline:none; box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--ui-hot); border-radius:var(--r-sm)}

.tools{ order:1; flex:0 0 var(--tools); width:var(--tools); }
.preview-col{ order:3; flex:1 1 auto; }

/* ===================== الأدوات ===================== */
.tools{
  background:var(--panel); color:var(--fg);
  display:flex; flex-direction:column; min-height:0; min-width:0;
  border-inline-start:0;
  /* الفصل عن عمود المعاينة بظلٍّ خفيف على الحافة، لا بخيط */
  box-shadow:2px 0 10px -6px rgba(5,16,45,.28);
  position:relative; z-index:1;
}
/* ============================================================
   الصدَفة العليا.

   كانت شريطين لا شريطاً: شريطُ الشعار فوق الأدوات بارتفاع، وشريطُ
   المعاينة بارتفاع آخر، بلونين ولا شيء يجمعهما — فلم يكن للبرنامج
   حرفٌ أعلى واحد، وذلك أظهرُ ما كان يشينه.

   فصار الشريطان واحداً: ارتفاعٌ واحد (--bar) ولونٌ واحد هو الأزرق
   السحيق في الوضعين، يقطعه الفاصلُ ولا يقطع لونَه. والشعار مذهَّب
   عليه، فهو اسم البرنامج ولا يُكتب الاسم بجانبه.
   ============================================================ */
/* الفصل عن المحتوى صار بتباين اللون الداكن نفسه، لا بخيطٍ حوله. */
.brand{
  flex:0 0 auto; height:var(--bar); padding:0 16px;
  background:var(--chrome); color:var(--chrome-fg);
  border-bottom:0;
  display:flex; align-items:center; gap:11px;
}
.brand .logo{
  flex:0 0 auto; display:inline-flex; align-items:center;
  width:44px; color:var(--gold-2); transition:color .13s;
}
/* الشعار مخطوطة، فيبقى على ارتفاعٍ يقلّ عن الصدَفة بلا حشوة داخل
   الرمز نفسه: كان يزاحم الشريط ويوحي بعمقٍ ليس فيه */
.brand .logo svg{width:100%; height:auto; display:block; max-height:32px}
.brand .logo .notch{fill:var(--chrome)}   /* الفراغ داخل الشعار يتبع لون الصدَفة */
.icon-btn{
  margin-inline-start:auto; width:34px; height:34px; border-radius:var(--r);
  border:0; background:rgba(255,247,227,.08);
  color:var(--chrome-fg-2);
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  font-size:15px; transition:background .13s, color .13s, transform .10s;
}
.icon-btn:hover{background:rgba(255,247,227,.16); color:var(--chrome-fg)}
/* الضغطة تُحسّ بانكماشٍ خفيف لا بتغيّر لون: أثرٌ فيزيائيّ لا زخرفيّ */
.icon-btn:active{transform:scale(.94)}

.tab{flex:1 1 auto; min-height:0; display:none; flex-direction:column}
.tab.on{display:flex}
#tabSettings{overflow-y:auto}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--edge-2); border-radius:5px; border:2px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--gold); background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.sec-head{
  position:relative;
  width:100%; background:none; border:0; cursor:pointer; text-align:start;
  padding:12px 18px; display:flex; align-items:center; gap:9px;
  font-family:var(--display); font-size:19px; font-weight:700; line-height:1.5;
  color:var(--fg-2); transition:background .13s, color .13s, transform .10s;
}
.sec-head:hover{background:var(--panel-2); color:var(--fg)}
.sec-head:active{transform:scale(.995)}
.sec-head .chev{margin-inline-start:auto; color:var(--fg-3); font-size:10px; transition:transform .18s; font-family:var(--sans)}
/* مسطرة الهامش: خيط ذهبي على حرف العمود يدلّ على القسم المفتوح،
   كما تُعلَّم أبواب المخطوط في هامشها */
.sec-head::before{
  content:""; position:absolute; inset-block:0; inset-inline-start:0;
  width:2px; background:var(--gold); opacity:0; transition:opacity .16s;
}
.sec.open .sec-head{color:var(--ui)}
.sec.open .sec-head::before{opacity:1}
.sec.open .sec-head .chev{transform:rotate(-90deg); color:var(--gold-ink)}
.sec-body{display:none; padding:2px 18px 18px}
/* فتح القسم بانزلاقة خفيفة بدل القطع الفجائي في العرض */
.sec.open .sec-body{display:block; animation:sec-open .18s ease-out}
@keyframes sec-open{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
/* الفاصل بمعقودة ذهبية في وسطه — علامة انتهاء الباب في المخطوط */
.divider{
  position:relative; height:1px; margin:19px 0 17px;
  background:linear-gradient(90deg,transparent,var(--edge-2) 14%,var(--edge-2) 86%,transparent);
}
.divider::after{
  content:"❖"; position:absolute; inset-inline-start:50%; top:50%;
  transform:translate(50%,-50%); background:var(--panel);
  padding:0 9px; color:var(--gold-ink); font-size:9px; line-height:1;
}

/* ============================================================
   لوح النصّ الخام — صار في عمود المعاينة لا في الأدوات.

   وهو والمعاينةُ وجهان لشيء واحد، يتناوبان مكاناً واحداً تحت
   الشريط الأعلى: أحدهما ظاهر والآخر مطويّ، ونصّهما واحد لا
   نسختان — ‎#src‎ هو أصل الوثيقة في الحالين.
   ============================================================ */
.raw-pane{flex:1 1 auto; min-height:0; display:none; flex-direction:column; background:var(--panel)}
/* ظهور اللوح بتلاشٍ خفيف بدل القطع الفجائي عند التبديل */
.raw-pane.on{display:flex; animation:pane-in .16s ease-out}
@keyframes pane-in{from{opacity:0} to{opacity:1}}
.text-bar{
  flex:0 0 auto; height:46px; padding:0 20px; display:flex; align-items:center; gap:8px;
  border-bottom:0; background:var(--panel-2);
}
.text-bar .who{flex:1; min-width:0; font-family:var(--display); font-size:16px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.text-bar .cnt{font-size:11px; color:var(--fg-3); font-variant-numeric:tabular-nums; white-space:nowrap}
#src{
  flex:1 1 auto; width:100%; min-height:0; border:0; outline:0; resize:none;
  padding:16px 20px; direction:rtl;
  font-family:Consolas,"Courier New",monospace; font-size:13.5px; line-height:1.95;
  background:var(--panel); color:var(--fg);
}
#src::placeholder{color:var(--fg-3)}

.row{margin-bottom:12px}
.row:last-child{margin-bottom:0}
.row label{display:block; font-size:11px; color:var(--fg-3); margin-bottom:6px; font-weight:600; letter-spacing:.03em}
.inp{
  width:100%; height:35px; padding:0 10px;
  border:0; border-radius:var(--r);
  background:var(--panel-2); color:var(--fg); font-size:13px;
  transition:box-shadow .13s, background .13s;
}
.inp::placeholder{color:var(--fg-3)}
.inp:focus{outline:none; background:var(--panel); box-shadow:0 0 0 3px var(--ui-soft)}
select.inp{cursor:pointer}
.pair{display:flex; gap:8px}
.pair > *{flex:1; min-width:0}

.btn{
  height:35px; padding:0 12px; border-radius:var(--r);
  border:0; background:var(--panel-2); color:var(--fg);
  font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:background .13s, box-shadow .13s, color .13s, transform .10s; white-space:nowrap;
  box-shadow:var(--sh-1);
}
.btn:hover:not(:disabled){background:var(--panel-3); color:var(--ui)}
.btn:active:not(:disabled){transform:translateY(1px); box-shadow:none}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn-sm{height:30px; padding:0 9px; font-size:12px}
.btn-primary{background:var(--ui-fill); color:var(--ui-on); font-weight:700}
.btn-primary:hover:not(:disabled){background:var(--ui-hot); color:var(--ui-on); transform:translateY(-1px)}
.btn-danger{color:#A8382A; background:var(--panel-2)}
body.dark .btn-danger{color:#E58A7B}
.btn-danger:hover:not(:disabled){background:rgba(168,56,42,.14); color:#A8382A}
body.dark .btn-danger:hover:not(:disabled){background:rgba(229,138,123,.16); color:#E58A7B}
.btn-full{width:100%}
.btn-row{display:flex; gap:7px}
.btn-row .btn{flex:1; min-width:0}
/* زر التصحيح الشامل: الإجراء الرئيسي في قسم التدقيق، فهو أعمق
   الأزرق وأعلى الأزرار، ولمعانُه الذهبي يفرده عمّا حوله بظلٍّ لا
   بحدّ. وكان يأخذ لون عناوين الوثيقة — وهو لون يختاره المستخدم
   لورقته لا لأزراره. */
.fixall-row{margin-top:9px}
.btn-fix{
  height:38px; font-size:14px; font-weight:700;
  color:var(--cream); background:linear-gradient(180deg,var(--marine),#22376E);
  box-shadow:var(--sh-2), 0 0 0 1px rgba(184,147,67,.55) inset;
}
.btn-fix:hover:not(:disabled){background:linear-gradient(180deg,var(--horizon),var(--marine)); color:var(--cream); transform:translateY(-1px)}
.btn-fix:disabled{background:var(--panel-2); box-shadow:none; color:var(--fg-3)}

.filelist{list-style:none; margin:11px 0 0; padding:0; max-height:210px; overflow-y:auto}
.filelist li{
  display:flex; align-items:center; gap:7px; padding:7px 9px; margin-bottom:5px;
  border:0; border-radius:var(--r-sm); background:var(--panel-2);
  font-size:12px; transition:background .13s, box-shadow .13s;
}
.filelist li .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.filelist li .st{font-size:10.5px; color:var(--fg-3); white-space:nowrap}
.filelist li.done .st{color:var(--ok)}
.filelist li.err  .st{color:#A8382A}
body.dark .filelist li.err .st{color:#E58A7B}
.filelist li.pick{cursor:pointer}
.filelist li.pick:hover{background:var(--panel-3)}
.filelist li.active{background:var(--ui-soft); box-shadow:inset 2px 0 0 var(--gold)}
.filelist li .x{border:0; background:none; cursor:pointer; color:var(--fg-3); font-size:14px; line-height:1; padding:3px 5px; border-radius:4px}
.filelist li .x:hover{color:#A8382A; background:var(--panel-3)}

.stat{font-size:12px; margin-top:10px; min-height:17px; color:var(--fg-2)}
.stat.ok{color:var(--ok)} .stat.err{color:#A8382A}
body.dark .stat.err{color:#E58A7B}
.note{font-size:11px; color:var(--fg-3); margin:10px 0 0; line-height:1.6}

/* ============================================================
   زرّ الاستخراج الطائر.

   لم يبقَ للاستيراد قسمٌ في العمود: الملفّ يدخل بإفلاته على الوثيقة
   أو بلصقه في نصّها الخام، فتُفتح له جلسةٌ جديدة ويبقى معلَّقاً حتى
   يأذن المستخدم. فالزرّ حيث تقع العينُ بعد الإفلات — أسفلَ الشاشة
   في وسطها — لا في ركنٍ من عمودٍ لا ينظر إليه أحد.

   وهو في الوسط لا على حرفٍ من الحرفين، فيصحّ فيه ‎left:50%‎ مع
   إزاحةٍ بنصف عرضه: مركزيّةٌ لا تعرف يميناً من يسار، فلا تنقلب
   بانقلاب اتّجاه الواجهة.
   ============================================================ */
.extract-fab{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
  z-index:40; display:none; flex-direction:column; align-items:center; gap:7px;
  max-width:min(560px,92vw); pointer-events:none;
}
.extract-fab.on{display:flex}
.extract-fab .fab-row{pointer-events:none; display:flex; align-items:center; gap:8px}
.extract-fab #runOcr{
  pointer-events:auto;
  height:44px; padding:0 26px; border-radius:23px;
  border:0; background:linear-gradient(180deg,var(--marine),#22376E);
  color:var(--cream); font-family:var(--display); font-size:17px; font-weight:700;
  cursor:pointer; white-space:nowrap; transition:.13s;
  box-shadow:var(--sh-2), 0 10px 30px -8px rgba(5,16,45,.62);
}
.extract-fab #runOcr:hover:not(:disabled){background:linear-gradient(180deg,var(--horizon),var(--marine))}
.extract-fab #runOcr:disabled{opacity:.62; cursor:not-allowed}
/* الزرّ إجراءٌ رئيسيّ فيبقى أزرقَ صريحاً، غير أنه خُفّف ليجاور
   الأسطحَ المهدَّأة حوله بلا أن يبهر */
body.dark .extract-fab #runOcr{background:linear-gradient(180deg,#4E76B8,#3A5A92)}
body.dark .extract-fab #runOcr:hover:not(:disabled){background:linear-gradient(180deg,#5E86C8,#4E76B8)}
/* زرّ التجاهل: من عائلة الزرّ الرئيسي بصريّاً لكن أصغر وأهدأ، فلا
   يُنازعه في الانتباه — دائرةٌ بحرفٍ واحد تُبعد الوثيقة المعلَّقة */
.extract-fab .fab-x{
  pointer-events:auto;
  width:30px; height:30px; padding:0; border-radius:50%;
  border:0; background:var(--panel);
  color:var(--fg-2); font-size:16px; line-height:1; font-family:var(--sans);
  cursor:pointer; transition:background .13s, color .13s;
  box-shadow:var(--sh-1);
}
.extract-fab .fab-x:hover{background:var(--panel-2); color:var(--fg)}
/* سطر الحال يحمل خلفيّته معه: يقع على الورقة البيضاء وعلى المكتب
   الغامق سواء، فلا يتّكل على لون ما تحته */
.extract-fab .fab-stat{
  pointer-events:none; max-width:100%;
  padding:4px 12px; border-radius:11px;
  background:var(--panel); border:0;
  color:var(--fg-2); font-size:11.5px; line-height:1.5;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  box-shadow:var(--sh-1);
}
.extract-fab .fab-stat:empty{display:none}
.extract-fab .fab-stat.ok{color:var(--ok)}
.extract-fab .fab-stat.err{color:#A8382A}
body.dark .extract-fab .fab-stat.err{color:#E58A7B}

/* ---------- اختيار اللون ---------- */
.swatches{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.swatch{
  width:30px; height:30px; border-radius:8px; cursor:pointer; padding:0;
  border:1px solid rgba(0,0,0,.16); position:relative; transition:.12s;
}
.swatch:hover{transform:translateY(-1px)}
.swatch:active{transform:scale(.92)}
.swatch.on::after{
  content:"✓"; position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; color:#fff; font-size:14px; font-weight:700;
}
.custom-wrap{
  display:flex; align-items:center; gap:9px; margin-top:11px;
  padding:9px 11px; border:0; border-radius:var(--r);
  background:var(--panel-2);
}
.custom-wrap .lbl{font-size:12px; color:var(--fg-2); font-weight:600}
.custom-wrap .hex{
  margin-inline-start:auto; font-family:Consolas,monospace; font-size:11.5px;
  color:var(--fg-3); text-transform:uppercase; direction:ltr;
}
.custom-wrap input[type=color]{
  width:32px; height:32px; padding:0; border:0;
  border-radius:var(--r-sm); background:none; cursor:pointer; box-shadow:var(--sh-1);
}

/* ---------- الاستبدال ---------- */
/* ============================================================
   عدّاد المطابقات في الطرف الأيسر من مربّع البحث.

   كان في طرف البدء — وهو في العربية اليمين — فيسبق الكلمةَ التي
   يعدّها ويزاحمها عند موضع الكتابة. وموضعه أن يتلوها: يكتب
   المستخدم من اليمين ويقرأ حصيلةَ ما كتب في الطرف الآخر. فنُقل
   إلى طرف الانتهاء، فيستقرّ يساراً في العربية ويميناً في
   الإنجليزية بلا قاعدةٍ ثانية، وتتبعه الحشوةُ إلى الجهة نفسها.
   ============================================================ */
.search-field{position:relative}
.search-field .inp{height:40px; padding-inline-end:64px; font-size:13.5px}
.search-field .tally{
  position:absolute; inset-inline-end:7px; top:50%; transform:translateY(-50%);
  height:24px; min-width:46px; padding:0 9px; border-radius:12px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;
  background:var(--panel-3); color:var(--fg-3); transition:.15s; pointer-events:none;
}
.search-field .tally.has{background:var(--ui-fill); color:var(--ui-on)}
/* فسحةٌ تحت الخيارات تفصلها عن مربّع الاستبدال، فقد كانا متلاصقين */
.opts{display:flex; gap:6px; margin-block:9px 13px; margin-inline:0}
.opt{
  height:27px; padding:0 10px; border-radius:14px; cursor:pointer;
  border:0; background:var(--panel-2); color:var(--fg-3);
  font-size:11.5px; font-weight:600; transition:background .13s, color .13s, transform .10s;
}
.opt:hover{color:var(--fg); background:var(--panel-3)}
.opt:active{transform:scale(.96)}
.opt.on{background:var(--ui-soft); color:var(--ui)}
.flow{display:flex; align-items:center; gap:9px; margin:14px 0 9px}
.flow .lbl{font-family:var(--display); font-size:14.5px; font-weight:700; color:var(--fg-2)}
.flow .rule{flex:1; height:1px; background:var(--edge-2)}

.hits{list-style:none; margin:0; padding:0; max-height:210px; overflow-y:auto}
.hits li{
  display:flex; align-items:flex-start; gap:8px; padding:7px 9px; margin-bottom:4px;
  border-radius:6px; background:var(--panel-2); border:0;
  font-size:12px; line-height:1.6; cursor:pointer; transition:background .12s;
}
.hits li:hover{background:var(--panel-3)}
.hits li .no{
  flex:0 0 auto; min-width:19px; height:19px; border-radius:5px; margin-top:1px;
  background:var(--panel-3); color:var(--fg-3);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums;
}
.hits li .ctx{flex:1; min-width:0; color:var(--fg-2)}
.hits li .ctx b{color:var(--fg); background:var(--ui-soft); border-radius:2px; padding:0 2px; font-weight:700}
.hits-more{font-size:11px; color:var(--fg-3); text-align:center; padding:6px 0 2px}
.hits-empty{font-size:12px; color:var(--fg-3); text-align:center; padding:18px 10px; border:0; background:var(--panel-2); border-radius:var(--r)}

/* ---------- التدقيق ---------- */
.check-list{list-style:none; margin:12px 0 0; padding:0; max-height:280px; overflow-y:auto}
.check-item{
  border:0; border-radius:var(--r); background:var(--panel-2);
  padding:9px 11px; margin-bottom:7px; font-size:12px; line-height:1.65;
  box-shadow:var(--sh-1);
  animation:card-in .16s ease-out;
}
@keyframes card-in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.check-item .hd{display:flex; align-items:center; gap:7px; margin-bottom:5px}
.check-item .pill{
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:9px; white-space:nowrap;
}
.pill-ok{background:rgba(27,107,74,.14); color:var(--ok)}
.pill-warn{background:rgba(184,147,67,.20); color:var(--warn)}
body.dark .pill-warn{background:rgba(207,177,120,.18)}
.pill-bad{background:rgba(168,56,42,.13); color:#A8382A}
body.dark .pill-bad{color:#E58A7B}
.check-item .ref{font-family:var(--display); font-size:14px; font-weight:700; color:var(--gold-ink); margin-inline-start:auto; font-variant-numeric:tabular-nums}
/* ============================================================
   المكتوب والصواب في صندوق واحد.

   كانا صندوقين: صندوقُ ما في الوثيقة، ثم صندوقٌ آخر تحته للنصّ
   المضبوط، بينهما فراغٌ وحدّان. فيقرأ المستخدم اثنين ويجمع بينهما
   في ذهنه. وإنما هما وجها شيء واحد: هذا ما كُتب، وهذا صوابه.
   فجُمعا في إطارٍ واحد يفصل بينهما خيطٌ رفيع لا حدٌّ كامل.
   ============================================================ */
.check-item .vpair{
  margin-top:6px; border:0; border-radius:var(--r);
  background:var(--panel); overflow:hidden;
}
.check-item .vpair .vrow{padding:7px 10px}
/* الفصل بين السطرين بلونٍ أهدأ من الصندوق نفسه، لا بخيط يقطعه */
.check-item .vpair .vrow + .vrow{background:var(--panel-2)}
.check-item .vpair .vrow.vfix{
  background:rgba(184,147,67,.09); border-inline-start:2px solid var(--gold);
}
body.dark .check-item .vpair .vrow.vfix{background:rgba(205,177,120,.08)}
.check-item .quote{
  color:var(--fg); font-family:var(--quran-font) !important; font-size:16px;
  max-height:66px; overflow:hidden; cursor:pointer; line-height:1.9;
}
.check-item .quote:hover{color:var(--ui)}
.check-item .fixrow{display:flex; gap:6px; margin-top:8px}
.check-item .fixrow .btn{flex:1; height:28px; font-size:11.5px}

/* ---------- المودال ---------- */
.overlay{position:fixed; inset:0; background:rgba(5,16,45,.62); display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
.overlay.on{display:flex}
.modal{
  width:100%; max-width:460px; background:var(--panel); color:var(--fg);
  border:0; border-radius:var(--r-lg);
  box-shadow:var(--sh-3); overflow:hidden;
}
.modal-head{
  padding:0 20px; height:var(--bar); display:flex; align-items:center; gap:10px;
  background:var(--chrome); color:var(--chrome-fg); border-bottom:1px solid var(--gold);
}
.modal-head h2{margin:0; font-family:var(--display); font-size:21px; font-weight:700}
.modal-head .close{margin-inline-start:auto; border:0; background:none; color:var(--chrome-fg-2); font-size:19px; cursor:pointer; padding:2px 7px; border-radius:6px; line-height:1}
.modal-head .close:hover{color:var(--chrome-fg); background:rgba(255,247,227,.12)}
.modal-body{padding:17px 20px 20px; max-height:74vh; overflow-y:auto}
.check{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12.5px; color:var(--fg-2); cursor:pointer}
.check input{width:15px; height:15px; accent-color:var(--ui-fill); cursor:pointer}
.modal-foot{display:flex; gap:8px; margin-top:17px}
.modal-foot .btn{flex:1}
.seg-mini{display:flex; background:var(--panel-3); border:0; border-radius:var(--r); padding:3px; gap:2px}
.seg-mini button{flex:1; border:0; background:none; cursor:pointer; height:30px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--fg-3); transition:.13s}
.seg-mini button:hover{color:var(--fg)}
.seg-mini button.on{background:var(--marine); color:var(--cream)}
body.dark .seg-mini button.on{background:var(--ui-fill); color:var(--ui-on)}

/* ===================== المعاينة ===================== */
.preview-col{display:flex; flex-direction:column; min-width:0; min-height:0}
/* ============================================================
   شريط الوثيقة — صفٌّ واحد لا يلتفّ ولا ينمو.

   على يمينه مفتاحُ الوجهين: معاينةٌ ونصٌّ خام. وعلى يساره تنسيقُ
   الورقة: خطُّها وحجمُه ولونُ عناوينها — كشريط برامج الكتابة،
   فوق الوثيقة نفسها، يُقلَّب فيه وتُرى نتيجته تحته في الحال، بدل
   أن تُطلَب من قسمٍ مطويّ في عمود الأدوات.
   والألوان ألوان الصدَفة، فهو منها لا فوقها.
   ============================================================ */
.preview-bar{
  flex:0 0 auto; height:var(--bar); padding:0 20px; display:flex; align-items:center; gap:10px;
  background:var(--chrome); border-bottom:0;
  font-family:var(--display); font-size:18px; font-weight:700; color:var(--chrome-fg);
  flex-wrap:nowrap; overflow:hidden;
}
/* المفتاح على الصدَفة الغامقة: لوحه شفيفٌ من الكريمي لا من لوح
   الأدوات، وإلا بدا رقعةً فاتحة مقحمة في شريط غامق */
.preview-bar .seg-mini{
  flex:0 0 auto; width:230px; background:rgba(255,247,227,.08);
}
.preview-bar .seg-mini button{font-family:var(--display); font-size:14.5px; font-weight:700; color:var(--chrome-fg-2)}
.preview-bar .seg-mini button:hover{color:var(--chrome-fg)}
.preview-bar .seg-mini button.on{background:var(--marine); color:var(--cream)}
body.dark .preview-bar .seg-mini button.on{background:var(--ui-fill); color:var(--ui-on)}
/* ============================================================
   أدوات التنسيق في الشريط.

   الشريط صفٌّ واحد بارتفاعٍ واحد لا يلتفّ (‎flex-wrap:nowrap‎)، فما
   زاد عن السعة يُضيَّق ولا يُدفَع إلى سطرٍ ثانٍ: اسمُ الخطّ أطولُ
   ما فيه، فهو وحده الذي يقبل الانكماش (‎flex:0 1 auto‎) وما سواه
   ثابتُ العرض. و‎min-width:0‎ شرطُ ذلك كلّه، وإلا أبى العنصر أن
   ينقص عن عرض محتواه فخرج الشريط عن حدّه.
   ============================================================ */
.bar-fmt{
  margin-inline-start:auto; min-width:0;
  display:flex; align-items:center; gap:7px; flex:0 1 auto;
}
.bar-lbl{
  flex:0 0 auto; font-family:var(--sans); font-size:11px; font-weight:600;
  color:var(--chrome-fg-2); white-space:nowrap; letter-spacing:.02em;
}
.bar-inp{
  height:28px; padding:0 7px; border-radius:var(--r-sm); cursor:pointer;
  border:0; background:rgba(255,247,227,.08);
  color:var(--chrome-fg); font-family:var(--sans); font-size:12px; font-weight:600;
  transition:background .13s;
}
.bar-inp:hover{background:rgba(255,247,227,.16)}
/* ‏قائمةُ الخطّ تُفتح لوحاً من لوح الأدوات لا من لوح الصدَفة: بعض
   المحرّكات ترث لون الشريط الغامق في الخيارات فتخرج حرفاً غامقاً
   على غامق، فيُصرَّح للخيار بلوحه وحبره */
.bar-inp option{background:var(--panel); color:var(--fg)}
.bar-font{flex:0 1 auto; min-width:0; max-width:210px; text-overflow:ellipsis}
.bar-size{flex:0 0 auto}
.bar-color{
  flex:0 0 auto; width:30px; height:28px; padding:0; cursor:pointer;
  border:0; border-radius:var(--r-sm);
  background:rgba(255,247,227,.08); transition:background .13s;
}
.bar-color:hover{background:rgba(255,247,227,.16)}

/* ============================================================
   زرّ التحرير الطائر.

   دائرةٌ على حرف الورقة من جهة بدء السطر، مذهَّبةُ الحدّ من لوح
   الصدَفة: هو من البرنامج لا من الوثيقة. ولا حرف فيه — القلمُ
   وحده يدلّ، وعنوانُه في ‎data-tt‎ لمن وقف عليه.
   ============================================================ */
.fab{
  position:absolute; inset-block-end:24px; inset-inline-start:26px; z-index:20;
  width:48px; height:48px; padding:0; border-radius:50%; cursor:pointer;
  border:0; background:var(--chrome); color:var(--gold-2);
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow:var(--sh-2), 0 10px 26px -8px rgba(5,16,45,.55); transition:.13s;
}
.fab:hover{transform:translateY(-2px); color:var(--cream)}
.fab:active{transform:scale(.94)}
.fab svg{display:block}
/* لا قلمَ على النصّ الخام: هو محرَّرٌ بنفسه، والورقة تحته مطويّة */
body.raw-view .fab{display:none}
/* وضع التحرير: الزرّ نفسه يصير مذهَّباً، فيُعرف أن الورقة مفتوحة للقلم */
.fab.editing{background:var(--gold); color:var(--abyss)}
.fab.editing:hover{background:var(--gold-2); color:var(--abyss)}

/* ============================================================
   ذيل عمود الأدوات: الحفظ خاتمةُ العمل فيثبت أسفله، لا يتمرّر
   مع الأقسام ولا يغيب عن العين مهما طالت.

   ولا شكلَ خلف الزرّين: رُفع لوحُ الذيل أوّلاً، وبقي بعده لوحُ
   الزرّ الثانوي نفسه — ‎--panel-2‎ على أرضٍ ‎--panel‎ — فيُرى
   مستطيلاً بيجيّاً خلف «حفظ Word» كأنّه صندوقٌ لا زرّ. فرُفع هو
   أيضاً: يطفو الزرّان على أرض العمود، يعرفهما الظلُّ تحتهما
   ولون الرئيسِ منهما، لا شكلٌ محيطٌ بهما.

   والزرُّ يُظهر لوحَه عند الحوم وحده، فيُعلم أنّه ممّا يُضغط.
   ============================================================ */
.tools-foot{
  flex:0 0 auto; padding:12px 16px 14px;
  border-top:0; background:transparent;
}
.tools-foot .btn:not(.btn-primary){background:transparent; box-shadow:none}
.tools-foot .btn:not(.btn-primary):hover:not(:disabled){
  background:var(--panel-2); box-shadow:var(--sh-1);
}
/* موضعٌ نسبيّ ليكون مرجعَ طبقة الشواهد: تُرسم بإحداثيات المحتوى
   المتمرِّر، فتصحبه صعوداً ونزولاً بلا حساب في كل إطار */
.preview-scroll{flex:1 1 auto; overflow:auto; padding:30px 22px 40px; background:var(--desk); min-height:0; position:relative}
body.raw-view .preview-scroll{display:none}
/* تلاشٍ بالعتامة فقط دون تحويل، فطبقة الشواهد #markLayer تُقاس بإحداثيات هذا العنصر */
body:not(.raw-view) .preview-scroll{animation:pane-in .16s ease-out}

#sheet{
  --acc:var(--doc-accent);
  --acc-tint:color-mix(in srgb, var(--doc-accent) 12%, #fff);
  --acc-edge:color-mix(in srgb, var(--doc-accent) 42%, #fff);
  background:var(--paper); width:210mm; max-width:100%; margin:0 auto;
  padding:20mm 18mm;
  border:0;
  box-shadow:0 1px 3px rgba(5,16,45,.14), 0 2px 6px rgba(5,16,45,.10), 0 18px 44px -18px rgba(5,16,45,.55);
  direction:rtl; text-align:right;
  font-family:"Traditional Arabic","Simplified Arabic",Arial,sans-serif;
  font-size:13pt; line-height:1.95; color:var(--paper-ink);
}
#sheet h1,#sheet h2,#sheet h3,#sheet h4,#sheet h5,#sheet h6{
  line-height:1.45; margin:1.3em 0 .5em; font-weight:700;
  color:var(--acc); break-after:avoid; page-break-after:avoid;
}
#sheet h1{font-size:1.58em; margin-top:0}
#sheet h2{font-size:1.3em}
#sheet h3{font-size:1.14em}
#sheet h4,#sheet h5,#sheet h6{font-size:1.02em; opacity:.85}
#sheet p{margin:0 0 .85em; text-align:justify}
#sheet ul,#sheet ol{margin:0 0 .9em; padding-inline-start:0; padding-inline-end:1.6em}
#sheet li{margin-bottom:.26em}
#sheet li::marker{color:var(--acc)}
#sheet table{border-collapse:collapse; width:100%; margin:1em 0; direction:rtl; font-size:.92em; break-inside:avoid}
#sheet th,#sheet td{border:1px solid var(--paper-line); padding:6px 10px; text-align:right; vertical-align:top}
#sheet th{background:var(--acc-tint); font-weight:700; color:var(--acc)}
#sheet hr{border:0; border-top:1px solid var(--paper-line); margin:1.5em 0}
#sheet code{font-family:Consolas,monospace; font-size:.87em; direction:ltr; background:var(--paper-2); padding:1px 5px; border-radius:4px; display:inline-block}
#sheet pre{background:var(--paper-2); border:1px solid var(--paper-line); border-radius:6px; padding:11px 14px; overflow-x:auto; direction:ltr; text-align:left; break-inside:avoid}
#sheet pre code{background:none; padding:0}
#sheet mark{background:var(--gold-3); color:#15171c; border-radius:2px; padding:0 1px}
#sheet mark.cur{background:var(--acc); color:#fff}
/* الآية لا تنقسم بين صفحتين */
#sheet .ayah{font-family:var(--quran-font) !important; break-inside:avoid; page-break-inside:avoid; box-decoration-break:clone}
#sheet .flash{background:var(--gold-3); border-radius:3px; transition:background 1.2s}

/* ===== وضع التحرير المباشر ===== */
#sheet[contenteditable="true"]{outline:2px dashed var(--gold); outline-offset:6px; cursor:text; contain:content}
/* ============================================================
   ما يُخفَّف عن الورقة ما دام القلم عليها.

   التبرير (justify) يُعيد حساب فواصل السطور وتشكيل الحروف للفقرة
   كلّها مع كلّ ضغطة مفتاح في العربية. ومعه ثلاثةٌ تزيد الحمل:

     • خصائصُ منع القسمة (‎break-inside‎ وأخواتها) شأنُها الطباعةُ
       وحدها، ومع ذلك يزنها المحرّك في كلّ دورة تخطيط.
     • ‎box-decoration-break:clone‎ على الآيات يُلزمه إعادةَ بناء
       زخرفة كلّ سطرٍ من المقطع على حدة.

   فتُرفع الثلاثةُ عن الورقة أثناء التحرير وحده، ثم تعود كما كانت
   عند الخروج منه. والملفُّ المُصدَّر والمطبوع لا يتأثّر بشيء من
   ذلك: كلاهما يُبنى من الماركداون لا من هذا الطراز الحيّ.

   ولا يُمسّ خطُّ المصحف وإن كان أثقلَ قياساً: تبديلُه يُغيّر صورةَ
   الآية تحت عين الكاتب، وذلك أنكى من بطءٍ يسير.
   ============================================================ */
#sheet[contenteditable="true"] p{text-align:right}
#sheet[contenteditable="true"] *{
  break-inside:auto; page-break-inside:auto;
  break-after:auto; page-break-after:auto;
}
#sheet[contenteditable="true"] .ayah{box-decoration-break:slice}
.preview-col{position:relative}

/* ============================================================
   شواهد التصحيح على هامش الورقة.

   التصحيح كان في عمود الأدوات وحده، والخطأ في الورقة: فيقرأ
   المستخدم في مكانٍ ويصحّح في مكان. فصارت لكلّ موضعٍ علامةٌ عند
   سطره، تُفتح فتُظهر الآية وصوابها إلى جنبه.

   وهي طبقةٌ فوق الورقة لا فيها: ‎#sheet‎ يُردّ ماركداونَ عند
   الخروج من التحرير، ويُنسخ حرفياً إلى ملفّ الطباعة وإلى وورد.
   فلو زُرعت العلامة داخله لخرجت في الوثيقة المُصدَّرة. وهي خارجه
   في ‎#markLayer‎، فلا يراها شيء من ذلك أصلاً — ولا يراها
   clearMarks ولا highlightAndList وهما يمشيان في نصّ ‎#sheet‎.
   ============================================================ */
/* ============================================================
   الطبقة نقطةُ إسنادٍ لا صندوق: عرضها وارتفاعها صفر وموضعها أصل
   المحتوى المتمرِّر، فما يُعلَّق عليها لا يُقصّ عند حافة المنظور.

   واتّجاهها من اليسار إلى اليمين وحدها في صفحةٍ عربية: مواضعُ
   أبنائها تُحسب بالبكسل من getBoundingClientRect، وهي أرقامٌ
   فيزيائية لا تعرف اتجاهاً. فيُثبَّت للطبقة اتجاهٌ واحد لئلّا
   ينقلب معناها بانقلاب لغة الواجهة. والمحتوى داخل اللوحة يُردّ
   إلى اتجاه الصفحة.
   ============================================================ */
#markLayer{
  position:absolute; inset-block-start:0; inset-inline-start:0;
  width:0; height:0; pointer-events:none; z-index:4; direction:ltr;
}
body.raw-view #markLayer{display:none}
#sheet[contenteditable="true"] ~ #markLayer{display:none}
/* ============================================================
   الحاشية: رقمٌ ونصٌّ مختصر، لا رقمٌ مجرَّد.

   كان الشاهدُ دائرةً فيها رقم، فلا يُعرف ما فيه إلّا بالنقر. وصار
   بطاقةً تحمل مع الرقم طرفاً من الصواب المقترح، فيُقرأ الخطأ من
   طرف العين بلا فتح. وتتّسع عند المرور فيظهر باقيه.

   وهي أسطحٌ مصمتة بلا حدود: الفصلُ بالخلفيّة والظلّ لا بالإطار.
   ============================================================ */
.vmark{
  position:absolute; pointer-events:auto;
  display:flex; align-items:center; gap:6px;
  max-width:186px; padding:5px 9px 5px 6px; border:0; border-radius:var(--r-sm);
  background:var(--panel); color:var(--fg);
  cursor:pointer; font-family:var(--sans); font-size:11px;
  line-height:1.35; text-align:start;
  box-shadow:var(--sh-1);
  transition:box-shadow .14s, transform .14s, background .14s;
  animation:mark-in .14s ease-out;
}
@keyframes mark-in{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
.vmark .vm-no{
  flex:0 0 auto; width:18px; height:18px; border-radius:6px;
  background:var(--ui-fill); color:var(--ui-on);
  font-size:10px; font-weight:700; font-variant-numeric:tabular-nums;
  display:flex; align-items:center; justify-content:center;
}
.vmark .vm-tx{
  flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-family:var(--quran-font); font-size:12.5px; color:var(--fg-2);
}
.vmark:hover{
  background:var(--panel-2); transform:translateY(-1px);
  box-shadow:0 2px 4px rgba(5,16,45,.2), 0 14px 30px -10px rgba(5,16,45,.6);
}
.vmark:active{transform:scale(.97)}
.vmark.on{background:var(--ui-fill)}
.vmark.on .vm-no{background:var(--ui-on); color:var(--ui-fill)}
.vmark.on .vm-tx{color:var(--ui-on)}
/* ============================================================
   لوحة التصحيح المنبثقة.

   ألوانها ألوان الأدوات لا ألوان الورقة: هي من البرنامج لا من
   الوثيقة، فيُعرف بالنظر أنها ليست ممّا يُطبع. وتبقى مقروءةً على
   الورقة البيضاء في الوضعين لأنها تحمل خلفيّتها معها.
   ============================================================ */
/* ============================================================
   عرضُ اللوحة بالبكسل لا بالنسبة.

   كانت ‎width:min(330px,80%)‎، والنسبةُ تُقاس من ‎#markLayer‎ وعرضُها
   صفرٌ بالنصّ (‎width:0‎) — فكانت اللوحةُ تنكمش إلى لا شيء وتضطرب.
   والارتفاعُ كان ‎60%‎ من صفرٍ كذلك. فصارا مقدارين ثابتين لا يتعلّقان
   بمقاس الطبقة، ويُحدّان بمقاس النافذة نفسها.
   ============================================================ */
.vpop{
  position:absolute; pointer-events:auto; z-index:5;
  width:340px; max-width:min(340px,86vw);
  max-height:min(420px,62vh); overflow-y:auto;
  background:var(--panel); color:var(--fg);
  border:0; border-radius:var(--r-lg);
  box-shadow:var(--sh-3);
  padding:13px 15px; font-family:var(--sans); font-size:12px; line-height:1.65;
  direction:rtl; text-align:start;
}
html[dir="ltr"] .vpop{direction:ltr}
.vpop .vp-hd{display:flex; align-items:center; gap:7px; margin-bottom:6px}
.vpop .vp-ref{
  font-family:var(--display); font-size:14px; font-weight:700;
  color:var(--gold-ink); font-variant-numeric:tabular-nums;
}
.vpop .vp-x{
  margin-inline-start:auto; border:0; background:none; cursor:pointer;
  color:var(--fg-3); font-size:16px; line-height:1; padding:1px 5px; border-radius:4px;
}
.vpop .vp-x:hover{background:var(--panel-2); color:var(--fg)}
.vpop .vp-cap{
  display:block; font-size:10px; font-weight:700; color:var(--fg-3);
  margin-bottom:3px; letter-spacing:.04em;
}
.vpop .vp-txt{
  font-family:var(--quran-font) !important; font-size:15.5px; line-height:2.05;
  color:var(--fg);
}
/* صفُّ العمل: أسطحٌ مصمتة بلا حدود، والفعلُ الأوّل ملوَّن ليُعرف */
.vpop .vp-row{display:flex; gap:7px; margin-block-start:11px}
.vpop .vp-btn{
  flex:1 1 auto; border:0; border-radius:8px; cursor:pointer;
  padding:7px 10px; font-family:var(--sans); font-size:11.5px; font-weight:600;
  background:var(--panel-2); color:var(--fg-2); transition:.13s;
}
.vpop .vp-btn:hover{background:var(--panel-3); color:var(--fg)}
.vpop .vp-btn:active{transform:translateY(1px)}
.vpop .vp-btn.primary{background:var(--ui-fill); color:var(--ui-on)}
.vpop .vp-btn.primary:hover{background:var(--ui-hot); color:var(--abyss)}

/* ===== بطاقة التدقيق ===== */


/* قائمة التدقيق داخل الأدوات، بمساحة تكفي للتصفح والمقارنة */
/* ============================================================
   قائمة المواضع تأخذ ما بقي من ارتفاع العمود بدل سقف ثابت.
   والحدّ الأدنى محسوب بالنسبة إلى ارتفاع النافذة لا برقم ثابت:
   الرقم الثابت يصير سجناً على الشاشات الكبيرة ويخنق القائمة
   حين تُفتح أقسام أخرى معها.
   ويُطوى ما سواه من الأقسام عند فتحه (انظر مُستمِع .sec-head)،
   فيخلو له العمود كلّه.
   ============================================================ */
/* لا سقف للقائمة ولا شريط تمرير داخلها: تمتدّ بطولها كلّه ويتمرّر
   عمود الأدوات نفسه. الصندوق داخل صندوق كان يحبسها في بضع مئات
   من البكسلات مهما كبرت الشاشة.
   ويُثبَّت العنوان وزر التصحيح أعلى العمود فيبقيان في المتناول
   مهما نزل المستخدم في القائمة. */
.verify-body .check-list{
  max-height:none; overflow:visible;
  margin-top:12px; padding-inline-end:2px;
}
#secVerify.open .sec-head{
  position:sticky; top:0; z-index:3;
  background:var(--panel); box-shadow:var(--sh-1);
}
.verify-body .sticky-controls{
  position:sticky; top:46px; z-index:2;
  background:var(--panel); padding:10px 0 8px; margin-top:-2px;
  box-shadow:var(--sh-1);
}
/* بطاقات أقلّ ترفاً في التباعد، فيظهر منها أكثر في الشاشة الواحدة.
   وسطر التشكيل يبقى فسيحاً لأن حركات المصحف تعلو الحرف وتنزل عنه. */
.verify-body .check-item{padding:10px 12px; margin-bottom:8px}
.verify-body .check-item .quote,
.verify-body .check-item .sugg{font-size:16.5px; line-height:2.05; max-height:none}
.verify-body .check-item .sugg.near{padding:9px 11px}
.verify-body .check-item .vpair .vrow{padding:9px 11px}
.verify-body .check-item .hd{margin-bottom:4px}
.verify-body .check-item .fixrow{margin-top:7px}
/* الوصل العربي يتطلب ألا تُقسَّم الكلمة بين وسوم؛ التمييز بالخلفية فقط */
.dw{display:inline; unicode-bidi:isolate-override; unicode-bidi:plaintext}

.font-warn{
  display:none; margin-top:10px; padding:8px 11px; border-radius:var(--r);
  background:rgba(184,147,67,.16); border:0; border-inline-start:3px solid var(--gold); color:var(--warn);
  font-size:11.5px; line-height:1.6;
}
.font-warn.on{display:block}

.check-item.settled{opacity:.55}
.done-sep{
  list-style:none; margin:16px 0 9px; padding:7px 0 0;
  border-top:1px solid var(--gold-3); font-family:var(--display);
  font-size:14px; font-weight:700; color:var(--fg-2);
}
.check-item .dsum{
  font-size:11px; color:var(--fg-3); margin-top:6px; font-weight:600; letter-spacing:.02em;
}
.check-item .dsum.mismatch{color:var(--warn)}
.check-item .sugg.wrote{background:var(--panel-3); border-style:dashed}
.vnum{
  display:inline-block; color:var(--doc-accent); font-weight:700;
  font-size:.86em; padding:0 3px; vertical-align:baseline;
}
.dw{border-radius:3px; padding:0 2px}
.dw.diac{background:#F2E1B4; color:#15171c}
/* على اللوح الليليّ: ذهبٌ شفيفٌ يُشير ولا يبهر، والحبر كريميّ كسائره */
body.dark .dw.diac{background:rgba(223,203,167,.20); color:var(--fg)}
.dw.extra{background:rgba(168,56,42,.22); text-decoration:line-through}
body.dark .dw.extra{background:rgba(229,138,123,.28); text-decoration:line-through}
.dw.missing{background:rgba(27,107,74,.24)}
body.dark .dw.missing{background:rgba(126,213,166,.26)}
.check-item .sugg{
  margin-top:7px; padding:7px 9px; border-radius:var(--r-sm);
  background:rgba(184,147,67,.09); border:0;
  border-inline-start:2px solid var(--gold);
  font-family:var(--quran-font) !important; font-size:15px; line-height:1.9; color:var(--fg);
}
body.dark .check-item .sugg{background:rgba(205,177,120,.08)}
/* ‏«أقرب آية» صندوق قائم بذاته: هي ظنٌّ لا موضعٌ مقطوع به، فلا
   تُجمع مع المكتوب في إطاره لئلّا تُقرأ على أنها صوابه المؤكَّد */
.check-item .sugg.near{margin-top:8px}
/* داخل الإطار المشترك: لا حدّ ولا حواف ولا هامش — الإطار يحملها */
.check-item .vpair .sugg{
  margin-top:0; padding:0; border:0; border-radius:0; background:none;
}
.check-item .sugg .cap{
  display:block; font-family:var(--sans); font-size:10px; font-weight:700;
  color:var(--fg-3); margin-bottom:3px; letter-spacing:.04em;
}
#sheet .page-mark{display:flex; align-items:center; gap:11px; margin:1.7em 0 1em; color:var(--acc); font-size:.72em}
#sheet .page-mark span{
  flex:0 0 auto; width:2.3em; height:2.3em; border-radius:50%; border:1px solid var(--acc-edge);
  display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-variant-numeric:tabular-nums;
}
#sheet .page-mark::after{content:""; flex:1 1 auto; height:1px; background:var(--acc-tint)}

.empty-state{text-align:center; padding:90px 24px; color:#8a8578}
.empty-state strong{display:block; font-family:var(--display); font-size:22px; font-weight:700; color:#5e6a86; margin-bottom:8px}
.empty-state span{font-size:13px}
.empty-state::after{content:"❖"; display:block; margin-top:20px; color:#c9bda2; font-size:11px}

/* ============================================================
   السجل — جلسة لكل كتاب، محفوظة ملفَّ md على القرص.
   البطاقة تعرض ما يميّز الجلسة: عنوانها، وحجمها، وتاريخ آخر عمل
   فيها. والمسار تحتها بخطّ آلة، فهو مسار لا كلام.
   ============================================================ */
.slist{list-style:none; margin:12px 0 0; padding:0}
.slist li{
  border:0; border-radius:var(--r); background:var(--panel-2);
  padding:9px 11px; margin-bottom:7px; transition:background .13s, box-shadow .13s;
}
.slist li:hover{background:var(--panel-3)}
.slist li.cur{background:var(--ui-soft); box-shadow:inset 2px 0 0 var(--gold)}
.slist .s-top{display:flex; align-items:baseline; gap:8px}
.slist .s-name{
  flex:1; min-width:0; font-family:var(--display); font-size:16px; font-weight:700;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
}
.slist .s-name:hover{color:var(--ui)}
.slist .s-meta{font-size:10.5px; color:var(--fg-3); white-space:nowrap; font-variant-numeric:tabular-nums}
.slist .s-path{
  font-family:Consolas,monospace; font-size:10px; color:var(--fg-3); direction:ltr;
  text-align:left; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.slist .s-row{display:flex; gap:6px; margin-top:7px}
.slist .s-row .btn{flex:1; height:27px; font-size:11.5px}
.sess-empty{
  font-size:12px; color:var(--fg-3); text-align:center; padding:18px 10px;
  border:0; background:var(--panel-2); border-radius:var(--r); margin-top:12px;
}
/* حقل المسار: خانة نصّ وزرّ تصفّح متلاصقان في سطر واحد */
.path-row{display:flex; gap:7px}
.path-row .inp{flex:1; min-width:0; font-family:Consolas,monospace; font-size:11.5px; direction:ltr; text-align:left}
.path-row .btn{flex:0 0 auto}

/* ============================================================
   الشريط الجانبي — قائمة الجلسات.

   شريطٌ على يسار البرنامج بصرياً (order:4 يجعله آخر عنصر في الصفّ،
   وفي الاتّجاه من اليمين إلى اليسار يعني ذلك الطرفَ الأيسر). فيه
   قائمة الجلسات وزرّ الإعدادات أسفلها، كسائر واجهات محادثة الذكاء
   الاصطناعي. يُطوى إلى ٥٢ بكسلاً برأسه وحده، فيبقى المفتاح ظاهراً.
   ============================================================ */
:root{ --nav:260px; }
.sidenav{
  order:4; flex:0 0 var(--nav); width:var(--nav);
  background:var(--panel); color:var(--fg);
  border-inline-start:0;
  box-shadow:-2px 0 10px -6px rgba(5,16,45,.28);
  position:relative; z-index:1;
  display:flex; flex-direction:column; min-height:0; min-width:0;
  transition:flex-basis .18s ease, width .18s ease;
  overflow:hidden;
}
body.side-collapsed{ --nav:52px; }
.sidenav-head{
  flex:0 0 auto; height:var(--bar); padding:0 10px;
  background:var(--chrome); color:var(--chrome-fg);
  border-bottom:0;
  display:flex; align-items:center; gap:7px;
}
.side-icon{
  flex:0 0 auto; width:34px; height:34px; border-radius:var(--r);
  border:0; background:rgba(255,247,227,.08);
  color:var(--chrome-fg-2); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:15px; transition:background .13s, color .13s, transform .10s;
}
.side-icon:hover{background:rgba(255,247,227,.16); color:var(--chrome-fg)}
.side-icon:active{transform:scale(.97)}
.side-icon svg{width:18px; height:18px; display:block}
.side-new{
  flex:1 1 auto; height:34px; padding:0 12px; border-radius:var(--r);
  border:0; background:rgba(255,247,227,.08);
  color:var(--chrome-fg); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  font-family:var(--display); font-size:14.5px; font-weight:700;
  transition:background .13s, color .13s, transform .10s; white-space:nowrap; overflow:hidden;
}
/* ============================================================
   الزائد في طرف الزرّ الأيسر لا ملتصقاً بالجملة.

   هو أوّل العنصرين في الترتيب، والاتّجاه من اليمين — فموضعه الطبيعيّ
   يمينُ الجملة. فيُدفع إلى الطرف الآخر بترتيبٍ يؤخّره وبهامشٍ
   تلقائيّ يأكل ما بينهما، فيستقرّ على الحافة اليسرى في العربية
   واليمنى في الإنجليزية بلا قاعدةٍ ثانية.
   ============================================================ */
.side-new{justify-content:flex-start}
.side-new .plus{
  font-size:16px; line-height:1; color:var(--gold-2);
  order:2; margin-inline-start:auto;
}
.side-new:hover{background:rgba(255,247,227,.16); color:var(--cream)}
.side-new:active{transform:scale(.97)}
body.side-collapsed .side-new{display:none}
body.side-collapsed .sidenav-head{padding:0 8px; justify-content:center}

.sidenav-body{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
  padding:8px 8px 12px;
}
body.side-collapsed .sidenav-body{padding:8px 6px}
body.side-collapsed .side-list,
body.side-collapsed .sidenav-empty{display:none}

.side-list{list-style:none; margin:0; padding:0}
.side-list li{
  position:relative;
  border-radius:7px; margin-bottom:2px; padding:8px 10px;
  cursor:pointer; transition:.12s;
  overflow:hidden;
}
.side-list li:hover{background:var(--panel-2)}
.side-list li:active{transform:scale(.995)}
/* الجلسة الجارية تُعرف بلوحها ولون عنوانها، لا بشريطٍ ذهبيّ إلى
   جنبها: اللونُ وحده كافٍ في التمييز، والشريطُ خيطٌ زائد */
.side-list li.cur{background:var(--ui-soft)}
/* جلسةٌ ذهب ملفّها: باهتةٌ مشطوبة، وإلى جنبها سببُها */
.side-list li.gone .nm{opacity:.5; text-decoration:line-through}
.side-list li.gone .gone-tag{
  display:block; font-size:10.5px; color:#A8382A;
  margin-block-start:2px; padding-inline-end:22px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
body.dark .side-list li.gone .gone-tag{color:#E58A7B}
.side-list li .nm{
  display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-family:var(--display); font-size:14.5px; font-weight:600; color:var(--fg-2);
  padding-inline-end:22px;
}
.side-list li:hover .nm, .side-list li.cur .nm{color:var(--fg)}
.side-list li.cur .nm{color:var(--ui)}
.side-list li .mm{
  border:0; background:none; cursor:pointer; color:var(--fg-3);
  position:absolute; inset-block-start:6px; inset-inline-end:6px;
  width:22px; height:22px; border-radius:4px; padding:0;
  visibility:hidden; font-size:14px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
}
.side-list li:hover .mm, .side-list li.cur .mm{visibility:visible}
.side-list li .mm:hover{background:var(--panel-3); color:var(--fg)}
.side-list li .rename-inp{
  width:calc(100% - 20px); padding:2px 5px;
  border:0; border-radius:var(--r-sm);
  background:var(--panel); color:var(--fg);
  box-shadow:0 0 0 2px var(--ui-hot);
  font-family:var(--display); font-size:14.5px; font-weight:600; outline:none;
}
.sidenav-empty{
  font-size:12px; color:var(--fg-3); text-align:center; padding:24px 12px;
  border:0; background:var(--panel-2); border-radius:var(--r); margin:8px 4px;
  line-height:1.6;
}
.sidenav-foot{
  flex:0 0 auto; padding:8px; border-top:0;
  background:var(--panel-2);
}
.side-settings{
  width:100%; height:38px; padding:0 12px; border-radius:var(--r);
  border:0; background:transparent; color:var(--fg-2);
  cursor:pointer; display:inline-flex; align-items:center; justify-content:flex-start;
  gap:10px; font-family:var(--display); font-size:14px; font-weight:600; transition:background .13s, color .13s;
}
.side-settings:hover{background:var(--panel); color:var(--fg)}
.side-settings .cog{font-size:16px}
body.side-collapsed .side-settings{justify-content:center; padding:0}
body.side-collapsed .side-settings .lbl{display:none}

.side-menu{
  position:fixed; z-index:60; min-width:158px;
  background:var(--panel); border:0; border-radius:var(--r);
  box-shadow:var(--sh-2);
  padding:4px; display:none;
}
.side-menu.on{display:block}
.side-menu button{
  display:block; width:100%; padding:7px 11px; text-align:start;
  background:none; border:0; cursor:pointer;
  font-size:12.5px; color:var(--fg-2); border-radius:4px;
  font-family:inherit;
}
.side-menu button:hover{background:var(--panel-2); color:var(--fg)}
.side-menu button.danger{color:#A8382A}
body.dark .side-menu button.danger{color:#E58A7B}
.side-menu button.danger:hover{background:rgba(168,56,42,.10)}

/* الرأس المطويّ يعرض المفتاحين رأسيّاً */
body.side-collapsed .sidenav-head{flex-wrap:wrap}

/* ============================================================
   صدَفةُ البرنامج لا تُحدَّد بالسحب.

   الجرُّ على شريط أدواتٍ فيظهر حرفُ الزرّ محدَّداً بالأزرق أظهرُ ما
   يفضح أن ما بين يديك صفحةُ وِب لا برنامج: لا شريطَ في برنامجٍ
   أصيل يُحدَّد نصّه. فيُمنع التحديد عن الصدَفة كلّها — الأشرطةُ
   والأعمدةُ والقوائم — ويُستثنى وجها الوثيقة: الورقةُ ونصُّها
   الخام، فهما ما يُقرأ ويُنسخ منه.
   ============================================================ */
.brand,.preview-bar,.text-bar,.tools-foot,.sidenav,.side-menu,.app-menu,
.sec-head,.seg-mini,.opts,.swatches,.filelist,.slist,.side-list,
.modal-head,.extract-fab,.fab,.vmark,.toast-wrap{
  user-select:none; -webkit-user-select:none;
}
#sheet,#src,.vpop,.check-item .quote,.check-item .sugg,.hits li .ctx{
  user-select:text; -webkit-user-select:text;
}

/* ============================================================
   قائمة الزرّ الأيمن — قائمة البرنامج لا قائمة المتصفّح.

   تُبنى على لغة ‎.side-menu‎ نفسها: لوحُها ولونُ حدّها ونصفُ قطرها
   وظلُّها وحشوةُ بنودها واحدة، فلا تبدو قائمتان في برنامجٍ واحد.
   وإنما أُفردت عنصراً مستقلاً لأن ‎#sideMenu‎ مربوطة بسطر الجلسة
   وبنودُها ثابتة، وهذه تُبنى بحسب ما تحت المؤشّر.

   والبند المعطَّل يُعرض ولا يُخفى: غيابُ «لصق» أشدُّ حَيرةً من
   ظهوره باهتاً — الأول يُشكّك في القائمة، والثاني يُخبر بالحال.
   ============================================================ */
.app-menu{
  position:fixed; z-index:70; min-width:172px;
  background:var(--panel); border:0; border-radius:var(--r);
  box-shadow:var(--sh-2);
  padding:4px; display:none;
}
.app-menu.on{display:block}
.app-menu button{
  display:flex; align-items:center; gap:10px;
  width:100%; padding:7px 11px; text-align:start;
  background:none; border:0; cursor:pointer;
  font-size:12.5px; color:var(--fg-2); border-radius:4px;
  font-family:inherit;
}
.app-menu button:hover:not(:disabled){background:var(--panel-2); color:var(--fg)}
.app-menu button:disabled{color:var(--fg-3); opacity:.5; cursor:default}
.app-menu .k{
  margin-inline-start:auto; font-size:10.5px; color:var(--fg-3);
  font-family:var(--sans); direction:ltr; letter-spacing:.02em;
}
.app-menu button:disabled .k{opacity:.7}

/* ============================================================
   شريط البشارة — يقول ما حُفظ وأين، ويعرض ما يُفعل به.

   وهو في أسفل الوسط: هناك تقع العين بعد ضغطة زرٍّ في ذيل العمود،
   ولأن الوسط لا يعرف يميناً من يسار فلا ينقلب بانقلاب اللغة —
   ‎left:50%‎ مع إزاحةٍ بنصف العرض، كزرّ الاستخراج سواء.
   وتتراكم الشرائط عموداً لا يدوس بعضها بعضاً: من صدّر ملفين
   في نفَسٍ واحد يرى خبريهما معاً.
   ============================================================ */
.toast-wrap{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
  z-index:80; display:flex; flex-direction:column-reverse; gap:9px;
  align-items:center; pointer-events:none;
  max-width:min(560px,92vw);
}
.toast{
  pointer-events:auto; max-width:100%;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 13px; border-radius:var(--r);
  background:var(--panel); color:var(--fg);
  border:0; border-inline-start:3px solid var(--gold);
  box-shadow:var(--sh-3);
  font-family:var(--sans); font-size:12.5px; line-height:1.6;
  animation:toast-in .18s ease-out;
}
.toast.err{border-inline-start-color:#A8382A}
body.dark .toast.err{border-inline-start-color:#E58A7B}
@keyframes toast-in{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.toast .t-txt{
  flex:1 1 190px; min-width:0; color:var(--fg-2);
  overflow:hidden; text-overflow:ellipsis;
}
.toast .t-txt b{
  display:block; color:var(--fg); font-family:var(--display);
  font-size:14.5px; font-weight:700;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.toast .t-act{
  flex:0 0 auto; height:28px; padding:0 10px; border-radius:var(--r-sm);
  border:0; background:var(--panel-2); color:var(--fg-2);
  font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
  transition:background .13s, color .13s; white-space:nowrap;
}
.toast .t-act:hover{background:var(--panel-3); color:var(--ui)}
.toast .t-x{
  flex:0 0 auto; border:0; background:none; cursor:pointer;
  color:var(--fg-3); font-size:16px; line-height:1;
  padding:1px 5px; border-radius:4px;
}
.toast .t-x:hover{background:var(--panel-2); color:var(--fg)}

@page{ size:A4; margin:20mm 18mm; }
@media print{
  html,body{height:auto !important; overflow:visible !important; background:#fff !important; display:block !important}
  .tools,.preview-bar,.overlay,.sidenav,.raw-pane{display:none !important}
  /* زرّا الاستخراج والتحرير من البرنامج لا من الوثيقة، فلا يُطبعان */
  .extract-fab,.fab{display:none !important}
  /* شواهد التصحيح من البرنامج لا من الوثيقة، فلا تُطبع */
  #markLayer,.vmark,.vpop{display:none !important}
  /* وكذلك قائمةُ الزرّ الأيمن وشرائطُ البشارة: كلامُ البرنامج
     للمستخدم لا حرفٌ من كتابه */
  .app-menu,.toast-wrap,.toast{display:none !important}
  .preview-col{display:block !important}
  .preview-scroll{display:block !important; overflow:visible !important; padding:0 !important; background:#fff !important}
  #sheet{width:auto !important; max-width:none !important; margin:0 !important; padding:0 !important; box-shadow:none !important; border:0 !important}
  #sheet mark,#sheet mark.cur{background:none !important; color:inherit !important}
  #sheet .qmark{border-bottom:0 !important}
  #sheet tr,#sheet li{break-inside:avoid; page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>

<aside class="tools">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 404.43 294.1" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M128.18,121.96l-11.45,26.02-28.07,6.92c-4.66,37.28,48.32,37.07,65.93,14.92,4.42-5.56,7.08-15.45,15.58-15.89-.19,7.65-6.34,15.73-2.76,23.24,4.02,8.45,15.84,8.26,23.1,4.55,12.7-6.48,9.37-29.28,23.66-33.79-2.07,13.83-7.6,19.27,4.99,29.47,2.83,2.3,20.8,12.66,23.01,10.47.03-3.26-.99-6.45-1.96-9.52-2.01-6.36-11.51-22.66-11.74-27.09-.29-5.59,10.09-19.45,12.21-25.31,3.01,1.47,13.43,29.04,14.24,33.71,2.7,15.39-3.94,34.31-11.93,47.49-5.71,9.42-6.36,10.46-17.81,7.19-9.97-2.84-17.43-10.44-23.5-18.46-10.16,20.31-42.37,30.08-47.51.98-9.24,8.9-18.2,16.44-31.61,17.85-40.04,4.21-49.28-25.17-41.39-58.81-25.14,7.28-64,25.81-66.98,55.44-5.23,51.94,65.63,55.08,101.37,51.31,8.17-.86,18.93-4.34,26.4-4.63,1.65-.06,2.05-.44,3.21,1.25-.03.99-12.57,10.88-14.52,12.44-14.18,11.34-23.01,20.7-41.97,22.01-33.22,2.28-75.59-5.78-85.19-42.74-8.26-31.8,5.54-70.02,29.69-91.61,9.33-8.34,20.91-13.55,31.01-20.45-14.08-4.48-27.18-9.7-42.39-7.89-8.45,1-17.4,7.32-17.61,16.29-6.91,2.51-3.36-10.45-2.51-14.41,13.7-63.81,71.12-10.98,105.01-10.98h21.5Z"/><path d="M241.23.14c2.13-1.46,11.67,8.82,13.46,10.93,41.09,48.25,28.48,113.28,34.5,170.3,1.93,18.26,4.9,32.02,27.25,28.24,29.24-4.95,27.71-61.4,59.77-53.23,13.28,3.39,26.42,26.22,27.87,39.09,2.03,18.12-4.96,32.45-14.9,46.89-18.77-4.3-39.72-10.39-52.49-25.51-7.22,13.46-18.26,24.86-34.85,23.86-21.49-1.3-25.71-21.86-27.64-39.37-2.65-24.04-.83-49.66-3.02-73.89-3.3-36.5-14.29-74.55-41.83-100.03L241.23.14ZM390.18,211.84c-3.1-12.36-22.59-35.44-36.34-25.81-7.54,5.28-1.28,9.23,4.03,12.65,3.37,2.18,30.88,14.53,32.32,13.16Z"/><path d="M309.19,137.93l4.68-11.05,90.31-33.89c.41.51-3.16,10.79-5.24,11.23l-89.74,33.71Z"/><path d="M234.92,242.56l-63.74,24.22c1.9-3.3,1.51-8.19,5.27-10.2l61.23-23.74-2.76,9.73Z"/><path class="notch" d="M390.18,211.84c-1.44,1.37-28.94-10.98-32.32-13.16-5.31-3.42-11.57-7.37-4.03-12.65,13.75-9.63,33.24,13.45,36.34,25.81Z"/></svg></span>
  </div>

  <div class="tab on" id="tabSettings">

    <!-- ============================================================
         لا قسمَ للاستيراد بعد اليوم: الملفّ يدخل بإفلاته على الوثيقة
         أو بلصقه في نصّها الخام، فيُفتح له جلسةٌ جديدة ويظهر زرّ
         الاستخراج أسفل الشاشة. وما بقي هنا مكتبةُ ما استُخرج.
         ============================================================ -->
    <div class="sec open" id="secDocs">
      <button class="sec-head" data-sec="secDocs"><span data-t="secDocs">الوثائق</span><span class="chev">◀</span></button>
      <div class="sec-body">
        <ul class="filelist" id="docList"></ul>
        <p class="note" id="docsNote"></p>
      </div>
    </div>

    <!-- ============================================================
         قسم «التنسيق» رُفع من العمود كلَّه: أمرُ الوثيقة صار في شريطها
         أعلاها، فلا يُطلب في مكانين. وما كان فيه ممّا لا يتّسع له
         الشريط — ألوانُ العناوين الجاهزة ورقمُ اللون — بقي عنصراً
         مخفيّاً هنا لا قسماً: ‎savePrefs‎ و‎restore‎ و‎setAccent‎ تقرأ
         ‎#swatches‎ و‎#hexOut‎ بأسمائها، فنزعُها يُسقط البرنامج.
         ============================================================ -->
    <div id="styleKeep" hidden>
      <div class="swatches" id="swatches">
        <button class="swatch on" data-c="#2A468B" style="background:#2A468B"></button>
        <button class="swatch" data-c="#05102D" style="background:#05102D"></button>
        <button class="swatch" data-c="#B89343" style="background:#B89343"></button>
        <button class="swatch" data-c="#14532d" style="background:#14532d"></button>
        <button class="swatch" data-c="#8f1d13" style="background:#8f1d13"></button>
        <button class="swatch" data-c="#4c2a75" style="background:#4c2a75"></button>
      </div>
      <span class="hex" id="hexOut">#2A468B</span>
    </div>

    <div class="sec" id="secFind">
      <button class="sec-head" data-sec="secFind"><span data-t="secFind">استبدال</span><span class="chev">◀</span></button>
      <div class="sec-body">
        <div class="search-field">
          <input type="text" class="inp" id="findInput" data-tp="findPh">
          <span class="tally" id="tally">—</span>
        </div>
        <div class="opts">
          <button class="opt on" id="optFlex" data-t="flex" data-tt="flexHint"></button>
          <button class="opt" id="optCase" data-tt="caseHint">Aa</button>
        </div>
        <input type="text" class="inp" id="replaceInput" data-tp="replaceWith">
        <div class="btn-row" style="margin-top:11px">
          <button class="btn btn-primary" id="btnReplaceAll" disabled data-t="replaceAll"></button>
          <button class="btn btn-danger" id="btnDeleteAll" disabled data-t="deleteAll"></button>
          <button class="btn" id="btnUndo" disabled data-tt="undo" style="flex:0 0 44px">↶</button>
        </div>
        <div class="stat" id="opResult"></div>
        <div class="flow"><span class="lbl" data-t="matches"></span><span class="rule"></span></div>
        <ul class="hits" id="hitList"></ul>
        <div class="hits-empty" id="hitsEmpty"></div>
        <div class="hits-more" id="hitsMore" style="display:none"></div>
      </div>
    </div>


    <div class="sec" id="secVerify">
      <button class="sec-head" data-sec="secVerify"><span data-t="secVerify">التدقيق</span><span class="chev">◀</span></button>
      <div class="sec-body verify-body">
        <div class="sticky-controls">
          <div class="btn-row">
            <button class="btn btn-sm" id="btnLoadQuran"></button>
            <button class="btn btn-sm btn-primary" id="btnVerify" disabled data-t="verifyRun"></button>
          </div>
          <div class="btn-row fixall-row">
            <button class="btn btn-fix btn-full" id="btnFixAll" disabled data-t="fixAll" data-tt="fixAllHint"></button>
            <button class="btn btn-danger" id="btnUndoAll" data-t="undoAll" style="display:none;flex:0 0 auto"></button>
          </div>
          <div class="stat" id="quranStatus"></div>
        </div>
        <div class="font-warn" id="fontWarn" data-t="fontWarnTxt"></div>
        <ul class="check-list" id="verifyList"></ul>
      </div>
    </div>

  </div>

  <!-- الحفظ خاتمةُ العمل، فموضعه أسفل العمود: يبقى في المتناول مهما
       طالت الأقسام فوقه، ولا يزاحم أدوات الوثيقة في شريطها -->
  <div class="tools-foot">
    <div class="btn-row">
      <button class="btn" id="btnDocx" data-t="saveDocx"></button>
      <button class="btn btn-primary" id="btnPrint" data-t="savePdf"></button>
    </div>
  </div>

</aside>

<div class="preview-col">
  <div class="preview-bar">
    <div class="seg-mini" id="viewSwitch">
      <button data-view="preview" class="on" data-t="viewPreview"></button>
      <button data-view="raw" data-t="viewRaw"></button>
    </div>
    <!-- التنسيق حيث تقع العين على أثره: فوق الورقة نفسها لا في قسمٍ
         مطويّ من عمود الأدوات. والخطّ وحجمُه ولونُ العناوين هي التي
         يُقلَّب فيها وتُرى نتيجتها في الحال، فهي التي تعلو الوثيقة.
         وما بقي — التباعد والألوان الجاهزة — في «التنسيق» كما كان. -->
    <div class="bar-fmt">
      <label class="bar-lbl" for="fontSel" data-t="font"></label>
      <select class="bar-inp bar-font" id="fontSel">
        <option value='"Amiri Quran","Traditional Arabic",serif'>Amiri Quran — للرسم العثماني (مرفق)</option>
        <option value='"Amiri","Traditional Arabic",serif'>Amiri (مرفق)</option>
        <option value='"Traditional Arabic","Amiri",serif'>Traditional Arabic</option>
        <option value='"Simplified Arabic",Arial,sans-serif'>Simplified Arabic</option>
        <option value='"Sakkal Majalla","Traditional Arabic",serif'>Sakkal Majalla</option>
        <option value='Arial,"Segoe UI",sans-serif'>Arial</option>
        <option value='Tahoma,Arial,sans-serif'>Tahoma</option>
      </select>
      <label class="bar-lbl" for="sizeSel" data-t="size"></label>
      <select class="bar-inp bar-size" id="sizeSel"><option>11pt</option><option>12pt</option><option selected>13pt</option><option>14pt</option><option>16pt</option></select>

/* ==================== Markdown ==================== */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function inline(x){var o=esc(x);
  o=o.replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1");
  o=o.replace(/`([^`]+)`/g,"<code>$1</code>");
  o=o.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
  o=o.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  o=o.replace(/﴿([^﴾]*)﴾/g,'<span class="ayah">﴿$1﴾</span>');
  return o;}
function isTableLine(l){var s=l.trim();return s.charAt(0)==="|"&&(s.match(/\|/g)||[]).length>=2;}
function isSep(c){return c.length>0&&c.every(function(x){return x===""||/^:?-{2,}:?$/.test(x);});}
function splitRow(l){return l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();});}

function render(md){
  if(!md.trim()){
    sheet.innerHTML='<div class="empty-state"><strong>'+t("emptyTitle")+'</strong><span>'+t("emptyBody")+'</span></div>';sheetGen++;return;}
  var lines=md.replace(/\r\n?/g,"\n").split("\n"),out=[],i=0,m;
  while(i<lines.length){
    var line=lines[i],tt=line.trim();
    if((m=tt.match(/^<!--\s*(?:صفحة|Page)\s*(\d+)\s*-->$/i))){
      out.push('<div class="page-mark" data-page="'+m[1]+'"><span>'+num(m[1])+'</span></div>');i++;continue;}
    if(/^<!--/.test(tt)){i++;continue;}
    if(!tt){i++;continue;}
    if(/^```/.test(tt)){var buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i].trim())){buf.push(lines[i]);i++;}
      i++;out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");continue;}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(tt)){out.push("<hr>");i++;continue;}
    if(isTableLine(line)){var rows=[];
      while(i<lines.length&&isTableLine(lines[i])){var c=splitRow(lines[i]);if(!isSep(c))rows.push(c);i++;}
      if(rows.length){var cols=Math.max.apply(null,rows.map(function(r){return r.length;})),tb=["<table>"];
        rows.forEach(function(r,idx){var tag=idx===0?"th":"td";tb.push("<tr>");
          for(var k=0;k<cols;k++)tb.push("<"+tag+">"+inline(r[k]||"")+"</"+tag+">");tb.push("</tr>");});
        tb.push("</table>");out.push(tb.join(""));}
      continue;}
    if((m=tt.match(/^(#{1,6})\s+(.*)$/))){var lv=m[1].length;out.push("<h"+lv+">"+inline(m[2])+"</h"+lv+">");i++;continue;}
    if(/^([-*+]|\d+[.)])\s+/.test(tt)){var ord=/^\d+[.)]\s+/.test(tt),items=[];
      while(i<lines.length){var lt=lines[i].trim();
        if(!/^([-*+]|\d+[.)])\s+/.test(lt))break;
        if(/^\d+[.)]\s+/.test(lt)!==ord)break;
        items.push("<li>"+inline(lt.replace(/^([-*+]|\d+[.)])\s+/,""))+"</li>");i++;}
      out.push((ord?"<ol>":"<ul>")+items.join("")+(ord?"</ol>":"</ul>"));continue;}
    var para=[tt];i++;
    while(i<lines.length){var nt=lines[i].trim();
      if(!nt||isTableLine(lines[i])||/^(#{1,6}\s|([-*+]|\d+[.)])\s|```|<!--)/.test(nt)||/^(-{3,}|\*{3,}|_{3,})$/.test(nt))break;
      para.push(nt);i++;}
    var body=inline(para.join(" "));
    if(body.trim())out.push("<p>"+body+"</p>");}
  sheet.innerHTML=out.join("\n");
  sheetGen++;                       /* ورقةٌ جديدة، فالفهرس القديم باطل */
}

/* ==================== البحث ==================== */
var DIAC=/[ً-ْٰـٓ-ٕ]/g;
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function charClass(c){
  if(/[اأإآٱ]/.test(c))return "[اأإآٱ]";
  if(/[يى]/.test(c))return "[يى]";
  if(/[هة]/.test(c))return "[هة]";
  if(/[وؤ]/.test(c))return "[وؤ]";
  return escRe(c);}
function buildRe(term){
  term=(term||"").trim(); if(!term)return null;
  if(flexible)term=term.replace(DIAC,"");
  var parts=[];
  for(var i=0;i<term.length;i++){var c=term[i];
    if(/\s/.test(c)){while(i+1<term.length&&/\s/.test(term[i+1]))i++;parts.push("\\s+");continue;}
    if(flexible){parts.push(charClass(c));if(/[؀-ۿ]/.test(c))parts.push("[\\u064B-\\u0652\\u0670\\u0640]*");}
    else parts.push(escRe(c));}
  try{return new RegExp(parts.join(""),matchCase?"g":"gi");}catch(e){return null;}}
function countInSource(){var re=buildRe(findInput.value);if(!re)return 0;
  var m=src.value.match(re);return m?m.length:0;}

var MAX_HITS=150;
function clearMarks(){
  var ms=sheet.querySelectorAll("mark");
  if(!ms.length)return;
  var parents=new Set();
  ms.forEach(function(m){parents.add(m.parentNode);m.replaceWith(document.createTextNode(m.textContent));});
  parents.forEach(function(p){p.normalize();});
  sheetGen++;                       /* العُقَد التُئمت، فالفهرس باطل */
}
function highlightAndList(){
  var re=buildRe(findInput.value),ul=$("hitList");
  ul.innerHTML=""; $("hitsMore").style.display="none";
  if(!re){$("hitsEmpty").style.display="block";$("hitsEmpty").textContent=t("hitsIdle");return;}
  var walker=document.createTreeWalker(sheet,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while((n=walker.nextNode()))nodes.push(n);
  var marks=[];
  nodes.forEach(function(node){
    if(node.parentNode&&node.parentNode.tagName==="MARK")return;
    var text=node.nodeValue; re.lastIndex=0;
    if(!re.test(text))return; re.lastIndex=0;
    var frag=document.createDocumentFragment(),last=0,mm;
    while((mm=re.exec(text))!==null){
      if(mm[0]===""){re.lastIndex++;continue;}
      if(mm.index>last)frag.appendChild(document.createTextNode(text.slice(last,mm.index)));
      var mk=document.createElement("mark");mk.textContent=mm[0];
      marks.push({el:mk,before:text.slice(Math.max(0,mm.index-30),mm.index),hit:mm[0],
        after:text.slice(mm.index+mm[0].length,mm.index+mm[0].length+30)});
      frag.appendChild(mk); last=mm.index+mm[0].length;}
    if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag,node);});
  if(marks.length) sheetGen++;      /* العُقَد انقسمت بالتظليل، فالفهرس باطل */
  if(!marks.length){$("hitsEmpty").style.display="block";$("hitsEmpty").textContent=t("hitsNone");return;}
  $("hitsEmpty").style.display="none";
  var frag=document.createDocumentFragment();
  marks.slice(0,MAX_HITS).forEach(function(m,i){
    var li=document.createElement("li");
    var no=document.createElement("span");no.className="no";no.textContent=num(i+1);
    var ctx=document.createElement("span");ctx.className="ctx";
    ctx.appendChild(document.createTextNode((m.before?"…":"")+m.before));
    var b=document.createElement("b");b.textContent=m.hit;ctx.appendChild(b);
    ctx.appendChild(document.createTextNode(m.after+(m.after?"…":"")));
    li.appendChild(no);li.appendChild(ctx);
    li.addEventListener("click",function(){
      sheet.querySelectorAll("mark.cur").forEach(function(x){x.classList.remove("cur");});
      m.el.classList.add("cur");m.el.scrollIntoView({block:"center",behavior:"smooth"});});
    frag.appendChild(li);});
  ul.appendChild(frag);
  if(marks.length>MAX_HITS){var more=$("hitsMore");more.style.display="block";
    more.textContent=t("hitsMore",{n:num(marks.length-MAX_HITS)});}
}
function refreshFind(){
  var c=countInSource(),term=findInput.value.trim();
  tally.textContent=term?num(c):"—";

/* ==== تحديث مؤجَّل: يمنع إعادة الرسم مع كل ضغطة مفتاح ==== */
var lastRendered=null, renderTimer=null;
function doUpdate(){
  /* ============================================================
     الورقة تحت القلم فلا تُرسم من جديد.

     ‎render‎ يكتب ‎#sheet.innerHTML‎ كلّه، فلو جرى والمستخدم يحرّر
     فيه ذهبت عُقَدُه التي يقف عليها المؤشّر، فيسقط موضعُ الكتابة
     ويضطرب المحرّك بين حدثٍ يكتب وشجرةٍ تُهدَم تحته — وذلك
     التعليقُ والانهيار. وما كُتب على الورقة يُردّ ماركداونَ عند
     الخروج من التحرير، فلا شيء يضيع بتأجيل الرسم.
     ============================================================ */
  if(editing){
    $("charCount").textContent=t("chars",{n:num(src.value.length)});
    return;
  }
  if(src.value!==lastRendered){
    render(src.value); lastRendered=src.value;
    /* تغيّر النص فبطلت نتائج التدقيق. لا يكفي إفراغها: لا بدّ من
       إخفاء بطاقاتها وتعطيل زر التصحيح الشامل، وإلا بقيت معروضة
       تشير إلى نصّ لم يعد موجوداً. */
    if(verifyResults.length){ verifyResults=[]; renderVerify(); }
    /* والورقة أُعيد رسمها للتوّ، فعُقَدُها التي كانت الشواهد تشير
       إليها لم تعد قائمة. تُمسح ولو كانت القائمة خاويةً أصلاً،
       فلا يبقى شاهدٌ معلَّق فوق نصٍّ حُرِّر تحته. */
    clearVerifyMarks();
    refreshFixAll();
  }
  else clearMarks();
  /* التظليل يلفّ المطابقات في ‎<mark>‎ داخل الورقة فقد تنزاح أسطرها.
     والشواهد فوقها لا فيها، فتُعاد بعده لا قبله. */
  highlightAndList();
  scheduleMarkReflow();
  $("charCount").textContent=t("chars",{n:num(src.value.length)});
  refreshFind();
}
function scheduleUpdate(){
  refreshFind();
  clearTimeout(renderTimer);
  renderTimer=setTimeout(doUpdate,150);
}

/* ==================== الاستبدال ==================== */
function applyReplace(replacement,key){
  var re=buildRe(findInput.value); if(!re)return;
  var before=src.value,count=(before.match(re)||[]).length;
  if(!count){opResult.textContent=t("noResults");opResult.className="stat";return;}
  undoStack.push(before); if(undoStack.length>30)undoStack.shift();
  var after=before.replace(re,replacement);
  if(replacement==="")after=after.replace(/[ \t]{2,}/g," ").replace(/ +([،.؛:!؟])/g,"$1");
  src.value=after; doUpdate(); persist();
  opResult.textContent=t(key,{n:num(count)}); opResult.className="stat ok";}
$("btnReplaceAll").addEventListener("click",function(){applyReplace(replaceInput.value.replace(/\$/g,"$$$$"),"replaced");});
$("btnDeleteAll").addEventListener("click",function(){

  applyReplace("","deleted");});
$("btnUndo").addEventListener("click",function(){

  src.value=undoStack.pop(); doUpdate(); persist();
  opResult.textContent=t("steppedBack"); opResult.className="stat";});
