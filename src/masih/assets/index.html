  try{ localStorage.setItem("masih.sideCollapsed",on?"1":"0"); }catch(e){}
  scheduleMarkReflow();          /* طيّ الشريط يوسّع الورقة فينساب نصّها */
}
$("sideToggle").addEventListener("click",function(){
  applySideCollapsed(!document.body.classList.contains("side-collapsed"));
});
$("sideNew").addEventListener("click",newSession);
$("sideSettings").addEventListener("click",openModal);
try{ if(localStorage.getItem("masih.sideCollapsed")==="1") applySideCollapsed(true); }catch(e){}

/* كلّ تغيّرٍ في المحتوى يُجدوِل حفظاً: نلفّ persist فيلتقط الكتابة
   والاستيراد والاستبدال والتصحيح جميعاً من مكانٍ واحد. */
var persistBase=persist;
persist=function(){ persistBase.apply(this,arguments); scheduleAutosave(); };

/* ============================================================
   مسار الحفظ — يقرأه الخادم ويكتب فيه ملفات الجلسات وما يُصدَّر.
   والافتراضي مجلد التنزيلات، وهو حيث يتوقّع المستخدم ملفاته.
   ============================================================ */
var settingsReady=true, defaultDir="";
function saveDirStat(msg,kind){
  $("saveDirStatus").textContent=msg||"";
  $("saveDirStatus").className="stat"+(kind?" "+kind:"");
}
function loadSettings(){
  return jsonReq("/settings").then(function(d){
    settingsReady=true;
    defaultDir=(d&&d.defaultDir)||"";
    $("saveDir").disabled=false; $("btnPickDir").disabled=false;
    $("saveDir").value=(d&&d.saveDir)||"";
    $("saveDir").placeholder=defaultDir;
    saveDirStat(t("saveDirDefault",{p:defaultDir}));
  }).catch(function(){
    settingsReady=false;
    $("saveDir").disabled=true; $("btnPickDir").disabled=true;
    saveDirStat(t("saveDirOff"));
  });
}
/* يُرجع وعداً: الحفظ لا يُغلق النافذة إلا بعد أن يُقبل المسار */
function pushSaveDir(){
  if(!settingsReady) return Promise.resolve(true);
  var wanted=$("saveDir").value.trim();
  return postJson("/settings",{saveDir:wanted}).then(function(d){
    $("saveDir").value=(d&&d.saveDir)||wanted;
    saveDirStat(t("saveDirSet",{p:$("saveDir").value||defaultDir}),"ok");
    return true;
  }).catch(function(err){
    saveDirStat(t("saveDirBad",{e:err.message}),"err");
    return false;
  });
}
$("btnPickDir").addEventListener("click",function(){
  var b=this; b.disabled=true;
  postJson("/pick-folder",{}).then(function(d){
    if(d && d.path){ $("saveDir").value=d.path; pushSaveDir(); }
  }).catch(function(err){
    /* المنتقي الأصيل قد يتعذّر؛ والخانة تبقى صالحة للكتابة باليد */
    saveDirStat(t("saveDirBad",{e:err.message}),"err");
  }).then(function(){ b.disabled=false; });
});

/* ============================================================
   قائمة الزرّ الأيمن.

   الصدَفةُ الأصيلة تكتم قائمة المتصفّح (انظر window.py)، غير أن
   كتمها وحده يترك المستخدم بلا قائمةٍ أصلاً — وهو أسوأ من قائمةٍ
   غريبة. فللبرنامج قائمتُه، بلغة ‎.side-menu‎ نفسها.

   وتُمنع القائمةُ الأصيلة هنا أيضاً ولا يُتَّكل على الصدَفة: قد
   تُفتح الصفحة في متصفّحٍ عاديّ (صدَفةٌ احتياطية أو ‎--no-window‎)،
   فتظهر قائمتان إحداهما فوق الأخرى.

   والبنود تتبع ما تحت المؤشّر: في حقلٍ يُحرَّر تصلح الأربعة، وعلى
   الورقة المقروءة النسخُ والتحديد، وفيما عداهما التحديدُ وحده.
   وما لا يصلح يُعطَّل ولا يُنزع.
   ============================================================ */
var appMenu=$("appMenu");
var ctxField=null;          /* الحقل الذي فُتحت القائمة فوقه، إن كان */

/* أفي الموضع حقلٌ يقبل القلم؟ */
function editableAt(el){
  if(!el || !el.closest) return null;
  var field=el.closest("textarea,input,[contenteditable='true']");
  if(!field) return null;
  if(field.disabled || field.readOnly) return null;
  /* حقول لا نصَّ فيها يُقصّ (لونٌ أو ملفّ) لا قائمةَ تحرير لها */
  if(field.tagName==="INPUT" && /^(color|file|checkbox|radio|range)$/i.test(field.type)) return null;
  return field;
}
/* أثمّة تحديدٌ قائم يُنسخ؟ */
function hasSelection(field){
  if(field && (field.tagName==="TEXTAREA"||field.tagName==="INPUT"))
    return field.selectionStart!==field.selectionEnd;
  var sel=window.getSelection();
  return !!(sel && !sel.isCollapsed && String(sel).length);
}
function closeAppMenu(){ appMenu.classList.remove("on"); }

function openAppMenu(x,y,ctx){
  /* التمكين أولاً ثم القياس: عرضُ القائمة لا يتغيّر بالتعطيل، لكن
     ترتيبَ العمل هذا يُبقي حسابَ الحوافّ على مقاسٍ نهائيّ */
  Array.prototype.forEach.call(appMenu.querySelectorAll("button[data-cmd]"),function(b){
    b.disabled = ctx.allow.indexOf(b.dataset.cmd)<0;
  });
  appMenu.classList.add("on");
  /* تُوضَع أولاً ثم تُقاس: العنصر المخفيّ عرضُه صفر */
  appMenu.style.left="0px"; appMenu.style.top="0px";
  var w=appMenu.offsetWidth, h=appMenu.offsetHeight;
  var vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  /* ============================================================
     الانقلاب عند الحافّة. والقائمة في العربية تُفتح إلى جهة بدء
     السطر طبعاً — أي إلى يسار المؤشّر — وفي الإنجليزية إلى يمينه،
     فتنساب مع القراءة لا ضدّها. ثم تُردّ داخل المنظور إن ضاق.
     ============================================================ */
  var rtl=(document.documentElement.dir!=="ltr");
  var left = rtl ? x-w : x;
  if(left+w>vw-6) left=x-w;
  if(left<6) left=Math.min(6,Math.max(0,vw-w-6));
  var top=y;
  if(top+h>vh-6) top=y-h;                 /* لا متّسع تحته: يُقلب فوقه */
  if(top<6) top=6;
  appMenu.style.left=Math.max(0,left)+"px";
  appMenu.style.top=Math.max(0,top)+"px";
}

document.addEventListener("contextmenu",function(e){
  e.preventDefault();
  var el=e.target;
  var field=editableAt(el);
  var allow;
  if(field){
    /* التحديدُ شرطُ القصّ والنسخ، فما لا شيء تحته يُعطَّل بندُه */
    allow=["selectAll"];
    if(hasSelection(field)){ allow.push("cut"); allow.push("copy"); }
    allow.push("paste");
  } else if(el && el.closest && el.closest("#sheet")){
    allow=["selectAll"];
    if(hasSelection(null)) allow.push("copy");
  } else {
    allow=["selectAll"];
  }
  /* الحقلُ يُركَّز قبل فتح القائمة: ‎execCommand‎ يعمل على ما فيه
     التركيز، وضغطةُ الزرّ الأيمن وحدها لا تنقله في كل المحرّكات */
  if(field && document.activeElement!==field){ try{ field.focus(); }catch(err){} }
  ctxField=field;
  openAppMenu(e.clientX,e.clientY,{allow:allow});
});

appMenu.addEventListener("mousedown",function(e){ e.preventDefault(); });  /* لا يضيع التركيز */
appMenu.addEventListener("click",function(e){
  var b=e.target.closest("button[data-cmd]");
  if(!b || b.disabled) return;
  var cmd=b.dataset.cmd;
  closeAppMenu();
  /* ‎execCommand‎ لا ‎navigator.clipboard‎: الأخير غير متزامن ويطلب
     إذناً في بعض المحرّكات فيظهر سؤالٌ غريب في برنامجٍ محليّ، وهو
     في ‎WebView2‎ قد يُردّ أصلاً. والأول يعمل في الحالين. */
  if(ctxField){ try{ ctxField.focus(); }catch(err){} }
  try{ document.execCommand(cmd); }catch(err){}
});

/* تُغلق بكل ما يُبطل موضعها: نقرةٌ خارجها، أو مفتاح الهروب، أو
   تمريرٌ يُزيح ما تحتها، أو خروج النافذة من التركيز */
document.addEventListener("click",function(e){
  if(appMenu.classList.contains("on") && !e.target.closest("#appMenu")) closeAppMenu();
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeAppMenu(); });
window.addEventListener("blur",closeAppMenu);
window.addEventListener("resize",closeAppMenu);
/* التمرير يُلتقط في مرحلة الالتقاط: أكثرُه يقع في حاويات داخلية
   لا في النافذة، وحدث التمرير لا يصعد */
document.addEventListener("scroll",closeAppMenu,true);

/* ==================== عمر البرنامج ====================
   البرنامج نافذة وخادم يخدمها. فإن أُغلقت النافذة لم يبقَ للخادم
   عمل، فيُخبَر لينتهي بدل أن يبقى معلّقاً في الخلفية.
   ====================================================== */
(function(){
  function beat(){ fetch("/alive",{method:"POST",keepalive:true}).catch(function(){}); }
  setInterval(beat,10000);
  window.addEventListener("pagehide",function(){
    /* sendBeacon وحده يصل بعد بدء إغلاق الصفحة */
    if(navigator.sendBeacon) navigator.sendBeacon("/bye");
    else fetch("/bye",{method:"POST",keepalive:true}).catch(function(){});
  });
})();

restore();
applyLang(lang);
checkQuranFont();
if(!quran) fetchQuran();
loadSessions();
})();
