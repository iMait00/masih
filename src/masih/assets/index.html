/* ==================== تدقيق الآيات ==================== */
/* المنطق كلّه في quran-engine.js: ملف مستقل لا يلمس الواجهة،
   وهو الوحيد الذي تغطّيه اختبارات آلية. ما يلي أسماء مختصرة له
   حتى يبقى بقيّة كود الواجهة كما هو دون تغيير. */
var QE=window.QuranEngine;
var qNorm=QE.qNorm, normMap=QE.normMap, markKey=QE.markKey, shape=QE.shape,
    normalMarks=QE.normalMarks, buildIndex=QE.buildIndex, toLatin=QE.toLatin,
    cleanQuote=QE.cleanQuote, analyse=QE.analyse, locate=QE.locate,
    nearest=QE.nearest, surahByName=QE.surahByName,
    locateByFootnote=QE.locateByFootnote, expandRef=QE.expandRef,
    refFromRange=QE.refFromRange, diffWords=QE.diffWords, VNUM=QE.VNUM;
function bareCompare(s){ return QE.markKey(s); }

/* ==================== مقارنة الفروق ==================== */
function diffHtml(parts,side){
  return parts.map(function(d){
    if(d.t==="same") return esc(side==="a"?d.a:d.b);
    if(d.t==="diac")
      return '<span class="dw diac">'+esc(side==="a"?d.a:d.b)+'</span>';
    if(d.t==="vnum")    return side==="b" ? '<span class="vnum">'+esc(d.b)+'</span>' : "";
    if(d.t==="extra")   return side==="a" ? '<span class="dw extra">'+esc(d.a)+'</span>' : "";
    if(d.t==="missing") return side==="b" ? '<span class="dw missing">'+esc(d.b)+'</span>' : "";
    return "";
  }).filter(Boolean).join(" ");
}
function diffSummary(parts){
  var d=0,mi=0,ex=0;
  parts.forEach(function(p){ if(p.t==="diac")d++; else if(p.t==="missing")mi++; else if(p.t==="extra")ex++; });
  /* أرقام الآيات ليست فروقاً */
  var bits=[];
  if(mi) bits.push(t("dMissing",{n:num(mi)}));
  if(ex) bits.push(t("dExtra",{n:num(ex)}));
  if(d)  bits.push(t("dDiac",{n:num(d)}));
  return bits.join(" · ");
}

/* يفصل الآيات بأرقامها بدل لصقها متتابعة */
function buildCorrection(ref,noNumbers){
  if(!ref.segs || !ref.segs.length) return shape(ref.canonical);
  if(ref.segs.length===1 && !ref.segs[0].full) return shape(ref.canonical);
  var n=ref.segs.length;
  return ref.segs.map(function(sg,i){
    /* الرقم فاصلٌ بين آيتين لا خاتمةٌ للاقتباس. وكان يُكتب بعد الآية
       الأخيرة أيضاً فيقع قبل القوس المزخرف الخاتم، فيخرج الاقتباس
       بقوسين: ﴿…﴿٨﴾﴾. فلا رقم بعد آخر آية، والمقطع الناقص لا رقم له. */
    var numbered = sg.full && !noNumbers && i < n-1;
    return shape(sg.text)+(numbered ? " \uFD3F"+num(sg.id)+"\uFD3E" : "");
  }).join(" ").trim();
}

/* رصد الاقتباسات وإحالات الحواشي — في المحرّك أيضاً */
var footnoteRefs=QE.footnoteRefs, findBraceQuotes=QE.findBraceQuotes,
    collectQuotes=QE.collectQuotes, stitchQuotes=QE.stitchQuotes;

var ignored={}, footnotes={}, fixedKeys={}, lastFix={};
try{ ignored=JSON.parse(localStorage.getItem("masih.ignored")||"{}"); }catch(e){ ignored={}; }

/* ============================================================
   مفتاح الموضع.

   كان qNorm(raw).slice(0,80) — وفيه عطبان:

   الأول أنه يقصّ عند ثمانين حرفاً، فالمقاطع الطويلة التي تتفق في
   أوائلها تشترك في مفتاح واحد، فيُحسب تصحيح أحدها تصحيحاً لبقيّتها
   فتُستثنى من «صحّح كل الآيات» وهي لم تُمسّ.

   والثاني أنه مبنيّ على النصّ المكتوب في الوثيقة، والنصّ يتغيّر
   بالتصحيح. فيُبنى المفتاح على المقابل القرآني حيث عُرف: هو واحد
   قبل التصحيح وبعده، فيُعرف الموضع أنه هو، ويصحّ عرضه في المنجَز
   ويصحّ التراجع عنه وحده.
   ============================================================ */
function keyFor(ref,raw){
  if(ref) return "q"+ref.sid+":"+ref.from+"-"+ref.to+":"+qNorm(ref.canonical);
  return "t:"+qNorm(raw);
}

/* quiet: جولة وسيطة داخل التصحيح الشامل — تُحدَّث النتائج بلا
   لمس شريط الحالة ولا إضافة خطوة تراجع جديدة */
function runVerify(quiet){
  if(!quran) return;
  /* رسمٌ مؤجَّل من آخر ضغطة مفتاح قد ينفّذ بعد لحظة فيمسح النتائج
     التي بنيناها للتوّ. فيُلغى ويُنفَّذ الآن، ليستقرّ النص قبل تحليله. */
  clearTimeout(renderTimer);
  doUpdate();
  var st=stitchQuotes(src.value);
  if(st.count){
    if(!quiet) undoStack.push(src.value);
    src.value=st.text; doUpdate(); if(!quiet) persist();
  }
  var quotes=collectQuotes(src.value);
  footnotes=footnoteRefs(src.value);
  verifyResults=[];
  quotes.forEach(function(q){
    var a=analyse(q.raw,q.kind), pinned=false;
    /* إن أحالت الحاشية إلى سورة وآية، فهي أوثق من البحث الأعمى */
    if(q.fn && footnotes[q.fn]){
      var fr=footnotes[q.fn], sObj=surahByName(fr.surah);
      if(sObj){
        var byFn=locateByFootnote(qNorm(cleanQuote(q.raw)),sObj,fr.ayah);
        if(byFn){ a={kind:"full",clean:cleanQuote(q.raw),quoted:cleanQuote(q.raw),ref:byFn}; pinned=true; }
        else if(a.ref && a.ref.sid!==sObj.id) a.fnMismatch=true;
      }
    }
    var status = a.kind==="none" ? "bad"
               : a.kind==="partial" ? "partial"
               : (bareCompare(a.quoted)===bareCompare(a.ref.canonical) ? "ok" : "warn");
    /* عدد مواضع ورود المقطع في المصحف. الحاشية إن ثبّتت الموضع
       رفعت الظنّ، فلا حاجة للعدّ. */
    var places = (pinned || a.kind!=="full") ? 1
               : QE.countPlaces(qNorm(cleanQuote(q.raw)));
    /* ما لا قرآن فيه أصلاً لا يُبنى له موضع: انظر worthShowing */
    if(!QE.worthShowing(q.kind,a)) return;
    verifyResults.push({raw:q.raw,quoted:a.quoted,kind:q.kind,fn:q.fn||null,fnMismatch:!!a.fnMismatch,
            status:status,ref:a.ref||null,start:q.start,end:q.end,
            near:a.near||null,covered:a.covered,total:a.total,places:places,pinned:pinned,
            key:keyFor(a.ref||null,q.raw),prev:null});
  });
  renderVerify();
  refreshFixAll();
  if(quiet) return;
  /* العدّ للمواضع التي تحتاج عملاً. وكلّ ما في القائمة قرآن، فكلّ
     ما ليس مطابقاً ولا متجاهَلاً يُعدّ. */
  var shown=verifyResults.filter(function(r){
    return r.status!=="ok" && !ignored[r.key];
  }).length;
  var fixedCount=verifyResults.filter(function(r){return r.status==="ok" && fixedKeys[r.key];}).length;
  var msg;
  if(!verifyResults.length) msg=t("verifyNone");
  else if(!shown) msg=t("verifyClean");
  else msg=t("verifyDone2",{n:num(shown),all:num(verifyResults.length)});
  if(fixedCount) msg+=" · "+t("sectionDone",{n:num(fixedCount)});
  if(st.count) msg=t("stitched",{n:num(st.count)})+" · "+msg;
  $("quranStatus").textContent=msg;
  $("quranStatus").className="stat"+(shown?" err":" ok");
}

/* ============================================================
   التصحيح الشامل — زر واحد يُصلح كل ما وُجد له مقابل في المصحف.

   الحذر مقصود: لا يُمسّ ما لم يُعثر له على موضع («ليست قرآناً»)،
   ولا ما تجاهله المستخدم. والعملية كلها خطوة تراجع واحدة، فإن لم
   تُعجبه النتيجة رجع عنها بضغطة.

   ويُعاد المسح بعد كل جولة: تصحيح آية قد يكشف آية أخرى كانت
   ملتصقة بها، فيُكرَّر حتى تستقرّ الوثيقة.
   ============================================================ */
/* حاجز أمان لا حدٌّ للعمل: الخروج الطبيعي أن تمرّ جولة كاملة بلا
   تغيير. وإنما هو خشية دورةٍ لا تنتهي لو تناوب استبدالان. */
var MAX_FIX_ROUNDS=12;

/* ============================================================
   أين يقع نصّ هذا الموضع من الوثيقة؟

   كان الاستبدال بـ indexOf من أول الوثيقة، فيقع في خطأين:
   يصحّح أوّل موضعٍ للمقطع المكرَّر لا الموضعَ الذي عُرضت بطاقتُه،
   ويصيب المقطعَ القصير داخلَ مقطعٍ أطولَ يحويه فيقطعه.

   فالبحث الآن مقيّد بحدود الموضع نفسه التي جاءت من المحرّك.
   وما بين القوسين يُستبدل بحدوده كلِّها بلا بحث أصلاً.
   ============================================================ */
function fixSpan(text,r,fix){
  if(typeof r.start!=="number"){
    var g=text.indexOf(fix.target);
    return g<0?null:{at:g,len:fix.target.length};
  }
  if(r.kind==="brace") return {at:r.start,len:r.end-r.start};
  var at=text.indexOf(fix.target,r.start);
  if(at<0 || at>=r.end) return null;
  return {at:at,len:fix.target.length};
}

/* ============================================================
   جولة استبدال واحدة، من آخر الوثيقة إلى أوّلها.

   الترتيب مقصود: كل استبدال يزيح ما بعده بفارق الطول، فلو بدأنا
   من الأول بطلت مواضع البقيّة في الجولة نفسها. وبالنزول من الآخر
   تبقى المواضع الأصغر صحيحة كما رصدها المحرّك.
   ============================================================ */
function applyFixPass(text,batch){
  var jobs=[];
  batch.forEach(function(r){
    var fix=fixFor(r); if(!fix.ready) return;
    var sp=fixSpan(text,r,fix); if(!sp) return;
    jobs.push({at:sp.at,len:sp.len,to:fix.correction});
  });
  jobs.sort(function(a,b){ return b.at-a.at; });
  var n=0, last=Infinity;
  jobs.forEach(function(j){
    if(j.at+j.len>last) return;                       /* تداخل: يُترك لجولة تالية */
    if(text.slice(j.at,j.at+j.len)===j.to) return;    /* مطابق أصلاً */
    text=text.slice(0,j.at)+j.to+text.slice(j.at+j.len);
    last=j.at; n++;
  });
  return {text:text,count:n};
}

function applyAllFixes(){
  if(!quran) return;
  var first=pendingFixes();
  if(!first.length){
    $("quranStatus").textContent=t("nothingToFix");
    $("quranStatus").className="stat";
    return;
  }
  if(!confirm(t("confirmFixAll",{n:num(first.length)}))) return;

  var before=src.value, applied=0, round=0;
  /* ============================================================
     لا يُعلَّم موضعٌ «مصحَّح» لمجرّد أننا حاولنا تصحيحه: كان ذلك
     يستثنيه من الجولات التالية وهو ما يزال معطوباً، فيقف الزر
     ويقول «لا شيء» والوثيقة فيها ما فيها. والحكم الآن للنصّ
     نفسه: يُعاد المسح بعد كل جولة، فما استقام خرج من القائمة
     بنفسه، وما بقي بقي.
     ============================================================ */
  while(round++ < MAX_FIX_ROUNDS){
    var batch=pendingFixes();
    if(!batch.length) break;
    var res=applyFixPass(src.value,batch);
    if(!res.count) break;              /* جولة كاملة بلا تغيير: استقرّ النص */
    applied+=res.count;
    batch.forEach(function(r){ fixedKeys[r.key]=1; });   /* للعرض في المنجَز لا للاستثناء */
    src.value=res.text; lastRendered=null; doUpdate();
    runVerify(true);
  }

  if(!applied){
    $("quranStatus").textContent=t("nothingToFix");
    $("quranStatus").className="stat";
    return;
  }
  undoStack.push(before);                   /* تراجع واحد يشمل الكل */
  bulkBefore=before;
  persist();
  runVerify();
  var left=pendingFixes().length;
  $("quranStatus").textContent=t("fixedAll",{n:num(applied)})
    + (left?" · "+t("stillPending",{n:num(left)}):"");
  $("quranStatus").className="stat ok";
  refreshFixAll();
}

var bulkBefore=null;
function undoAllFixes(){
  if(bulkBefore===null) return;
  src.value=bulkBefore; bulkBefore=null;
  fixedKeys={}; lastFix={};
  lastRendered=null; doUpdate(); persist(); runVerify();
  $("quranStatus").textContent=t("steppedBack");
  $("quranStatus").className="stat";
}

/* حالة الزر تتبع عدد المواضع القابلة للتصحيح */
function refreshFixAll(){
  var btn=$("btnFixAll"), undo=$("btnUndoAll");
  if(!btn) return;
  var n=quran?pendingFixes().length:0;
  btn.disabled=!n;
  btn.textContent=n?t("fixAllN",{n:num(n)}):t("fixAll");
  undo.style.display=(bulkBefore===null)?"none":"";
}

/* ============================================================
   علامات «صُحِّح» و«تُراجَع عنه» تخصّ الوثيقة التي وُضعت فيها.
   ولمّا صار المفتاح مبنيّاً على الآية نفسها لا على نصّ الوثيقة،
   لزم مسحُها عند فتح وثيقة أخرى — وإلا ظهرت آيةٌ سليمة في الوثيقة
   الجديدة وعليها «تم التصحيح» لأن مثلَها صُحِّح في وثيقة قبلها.
   ============================================================ */
function resetVerifyMarks(){
  fixedKeys={}; lastFix={}; bulkBefore=null;
}

/* ============================================================
   أين يقع هذا المقطع من الورقة المرسومة؟

   ‎#src‎ ماركداون و‎#sheet‎ هيئةٌ مبنيّة منه، فمواضع الحروف في
   الأول لا تدلّ على عُقَدٍ في الثاني. والطريق المجرَّب هنا أن
   يُمشى في نصوص الورقة ويُقارَن المسوّى بالمسوّى — التشكيل
   والهمزات تسقط من الطرفين فيبقى الحرف وحده. وهو ما كان في
   jumpTo، فأُفرد ليستعمله الشاهدُ على الهامش أيضاً، فلا يفترق
   موضعُ القفز عن موضع العلامة.
   ============================================================ */
/* ============================================================
   فهرسٌ يُبنى مرّةً للورقة الواحدة.

   كان كلّ نداءٍ يمشي في عُقَد الورقة كلّها ويسوّي نصَّ كلِّ عقدة.
   فإن كان في الوثيقة ثلاثون موضعاً كان المشيُ ثلاثين مرّة والتسويةُ
   ثلاثين ضعفاً — والتسويةُ هي الثمن لا المشي. ومع كلّ ضغطة مفتاح
   يُعاد ذلك كلّه، فتثقل النافذة حتى تجمد.

   فيُبنى الفهرس مشيةً واحدة، ويُحفظ ما دامت الورقة هي هي: مفتاحُه
   عدّادٌ يزيد مع كلّ رسمٍ جديد، فلا يُقرأ فهرسٌ بطل أصلُه.
   ============================================================ */
var sheetGen=0, findIdx=null, findIdxGen=-1;
function buildFindIndex(){
  var list=[];
  var walker=document.createTreeWalker(sheet,NodeFilter.SHOW_TEXT,null),n;
  while((n=walker.nextNode())){
    var v=n.nodeValue;
    if(!v || !v.trim()) continue;
    list.push({node:n, norm:qNorm(v)});
  }
  findIdx=list; findIdxGen=sheetGen;
  return list;
}
function findInSheet(text){
  var probe=qNorm(text).slice(0,40);
  if(!probe) return null;
  var idx=(findIdx && findIdxGen===sheetGen) ? findIdx : buildFindIndex();
  for(var i=0;i<idx.length;i++){
    if(idx[i].norm.indexOf(probe)>=0) return idx[i].node;
  }
  return null;
}

/* ============================================================
   الانتقال إلى الموضع داخل المعاينة دون فتح قسم الاستبدال.

   والورقةُ قد تكون مطويّةً حين يُضغط: النصّ الخام معروضٌ فـ
   ‎.preview-scroll‎ عليها ‎display:none‎، ومستطيلُ كلِّ عقدةٍ فيها
   أصفارٌ. فكان ‎scrollIntoView‎ يُنادى على عنصرٍ لا موضع له فلا
   يصنع شيئاً — يضغط المستخدم على التصحيح فلا ينتقل به.

   فتُبسَط الورقةُ أوّلاً، ثم يُقاس بعد أن يستقرّ التخطيط: القياسُ
   في النَّفَس نفسه يقع قبل أن يُخرج المتصفّح العنصرَ من الطيّ.
   ============================================================ */
function jumpTo(text){
  var wasRaw=document.body.classList.contains("raw-view");
  if(wasRaw) showTab("settings");
  var go=function(){
    var target=findInSheet(text);
    if(!target) return;
    var host=target.parentNode;
    host.classList.add("flash");
    host.scrollIntoView({block:"center",behavior:"smooth"});
    setTimeout(function(){ host.classList.remove("flash"); },1600);
  };
  if(wasRaw) setTimeout(go,0); else go();
}

/* ============================================================
   شواهد التصحيح على الورقة.

   البطاقةُ في العمود تقول ما الخطأ، والورقةُ تقول أين هو. وكان
   بينهما قفزة: يقرأ في العمود ثم يبحث بعينه في الوثيقة. فصار
   لكلّ موضعٍ يحتاج مراجعةً شاهدٌ مرقَّم عند سطره، يُفتح فتُعرض
   الآية وصوابها إلى جنبه بلا مغادرة الورقة.

   والشواهد كلّها في ‎#markLayer‎ خارج ‎#sheet‎، لا عنصرَ واحدٌ
   منها داخل الورقة. وهذا هو الضمان: ما يُصدَّر إلى وورد وإلى
   ملفّ الطباعة، وما يُردّ ماركداونَ عند الخروج من التحرير، كلّه
   مبنيٌّ من ‎#sheet‎ وأبنائه — فلا سبيل لشاهدٍ أن يتسرّب إليه.
   ============================================================ */
var markOpen=null;                 /* الشاهد المفتوحة لوحته، إن كان */

function clearVerifyMarks(){
  var layer=$("markLayer"); if(!layer) return;
  layer.innerHTML="";
  markOpen=null;
}

function closeMarkPop(){
  var layer=$("markLayer"); if(!layer) return;
  var pop=layer.querySelector(".vpop"); if(pop) pop.remove();
  layer.querySelectorAll(".vmark.on").forEach(function(b){ b.classList.remove("on"); });
  markOpen=null;
}

/* ============================================================
   لوحةُ موضعٍ واحد: إحالته ونصّه المضبوط، وتحته ما ورد في
   الوثيقة. تُرسم عند الشاهد وتُزاح إن خرجت عن حافة المنظور.
   ============================================================ */
function openMarkPop(btn,r){
  var layer=$("markLayer"), scroll=$("previewScroll");
  if(!layer||!scroll) return;
  var was=(markOpen===btn);
  closeMarkPop();
  if(was) return;                  /* الضغطة الثانية على الشاهد تُغلقه */

  var fix=fixFor(r);
  var parts=(r.ref && fix.correction) ? diffWords(fix.sideA,fix.correction) : null;

  var pop=document.createElement("div"); pop.className="vpop";
  pop.addEventListener("click",function(e){ e.stopPropagation(); });

  var hd=document.createElement("div"); hd.className="vp-hd";
  var ref=document.createElement("span"); ref.className="vp-ref";
  if(r.ref) ref.textContent=r.ref.surah+" "+num(r.ref.from)+(r.ref.to!==r.ref.from?"–"+num(r.ref.to):"");
  else if(r.near) ref.textContent=t("vNear")+": "+r.near.surah+" "+num(r.near.from);
  hd.appendChild(ref);
  var x=document.createElement("button"); x.className="vp-x"; x.textContent="×";
  x.title=t("markClose");
  x.addEventListener("click",function(e){ e.stopPropagation(); closeMarkPop(); });
  hd.appendChild(x);
  pop.appendChild(hd);

  /* النصّ المضبوط أولاً، فهو المقصود من فتح اللوحة */
  var correction=fix.correction || (r.near?shape(r.near.canonical):null);
  if(correction){
    var cap=document.createElement("span"); cap.className="vp-cap";
    cap.textContent=t("suggested")+(r.ref&&r.ref.segs&&r.ref.segs.length>1
                    ?" · "+t("multiVerse",{n:num(r.ref.segs.length)}):"");
    pop.appendChild(cap);
    var body=document.createElement("div"); body.className="vp-txt";
    if(parts) body.innerHTML=diffHtml(parts,"b"); else body.textContent=correction;
    pop.appendChild(body);
  }
  /* وما ورد في الوثيقة تحته، ليقابل بينهما بعينه */
  var cap2=document.createElement("span"); cap2.className="vp-cap";
  cap2.style.marginTop="7px";
  cap2.textContent=t("markInDoc");
  pop.appendChild(cap2);
  var was2=document.createElement("div"); was2.className="vp-txt";
  if(parts) was2.innerHTML=diffHtml(parts,"a"); else was2.textContent=fix.sideA||r.raw;
  pop.appendChild(was2);

  /* ============================================================
     أزرارُ العمل في اللوحة نفسها.

     كانت اللوحة تعرض ولا تفعل، فيضطرّ الناظرُ إلى قائمة التدقيق
     في العمود ليصحّح ما رآه. فصار التصحيحُ والتجاهلُ في موضع
     النظر، ولا يحتاج إلى مغادرة الورقة.
     ============================================================ */
  var row=document.createElement("div"); row.className="vp-row";
  if(fix.ready && fix.correction && fix.target){
    var ap=document.createElement("button");
    ap.className="vp-btn primary"; ap.textContent=t("vApply");
    ap.addEventListener("click",function(e){
      e.stopPropagation();
      closeMarkPop();
      applyOne(r,fix.target,fix.correction);
    });
    row.appendChild(ap);
  }
  var ig=document.createElement("button");
  ig.className="vp-btn"; ig.textContent=t("vIgnore");
  ig.addEventListener("click",function(e){
    e.stopPropagation();
    ignored[r.key]=1;
    try{ localStorage.setItem("masih.ignored",JSON.stringify(ignored)); }catch(err){}
    closeMarkPop(); renderVerify();   /* وهي تُعيد رسم الشواهد بنفسها */
  });
  row.appendChild(ig);
  pop.appendChild(row);

  layer.appendChild(pop);
  btn.classList.add("on");
  markOpen=btn;

  /* ============================================================
     الموضع: إلى جانب الشاهد، ثم يُردّ داخل عرض المحتوى إن خرج
     عنه. والحدود تُقاس بمرجع الطبقة نفسها، فمقياسٌ واحد للشاهد
     وللوحته ولحافّة الحاوي.
     ============================================================ */
  var layerBox=layer.getBoundingClientRect();
  var scrollBox=scroll.getBoundingClientRect();
  var top=parseFloat(btn.style.top)||0;
  var start=parseFloat(btn.style.left)||0;
  var w=pop.offsetWidth;
  var h=pop.offsetHeight;
  var leftEdge=scrollBox.left-layerBox.left;
  var rightEdge=leftEdge+scroll.clientWidth;
  /* تُفتح بعد البطاقة بعرضها هي لا بمقدارٍ مقدَّر */
  var x2=start+btn.offsetWidth+8;
  if(x2+w>rightEdge-8) x2=start-w-8;                 /* لا متّسع بعده: يُقلب قبله */
  if(x2<leftEdge+8) x2=leftEdge+8;
  pop.style.left=x2+"px";
  /* ولا تتدلّى أسفل المنظور: تُرفع بقدر ما خرج منها */
  var viewBottom=(scrollBox.top-layerBox.top)+scroll.clientHeight;
  var y2=Math.max(0,top);
  if(y2+h>viewBottom-8) y2=Math.max(0,viewBottom-h-8);
  pop.style.top=y2+"px";
}

/* ============================================================
   رسم الشواهد كلّها من جديد.

   يُنادى بعد كل فحص، وعند كل تغيّرٍ في النصّ يُنادى ما يمسحها:
   الشاهد يشير إلى سطرٍ بعينه، فإن تحرّك النصّ تحته صار كاذباً.
   ولا تُرسم في وضع التحرير المباشر ولا في النصّ الخام: الأولى
   لأن الورقة تحته قلم، والثانية لأن الورقة غير معروضة أصلاً.
   ============================================================ */
function renderVerifyMarks(){
  var layer=$("markLayer"), scroll=$("previewScroll");
  if(!layer||!scroll) return;
  clearVerifyMarks();
  if(editing) return;
  if(document.body.classList.contains("raw-view")) return;

  /* ============================================================
     المرجع هو الطبقةُ نفسها لا الحاوي: هي عنصرٌ في المحتوى
     المتمرِّر، فمستطيلُها ينزل بنزول التمرير كما تنزل الورقة.
     فالفارق بينها وبين السطر ثابتٌ مهما تمرّر المستخدم، ولا
     يُضاف إليه scrollTop ولا تُطرح منه حشوةُ الحاوي.
     ============================================================ */
  /* ============================================================
     قراءةٌ كلُّها أوّلاً ثمّ كتابةٌ كلُّها.

     كان كلُّ شاهدٍ يُقاس ثمّ يُلحَق باللوحة، فيتناوب القياسُ
     والإضافةُ على المتصفّح فيُلجئه إلى إعادة حساب التخطيط عند كلّ
     دورة. فتُجمَع المقاسات أوّلاً في مرّةٍ واحدة، ثمّ تُبنى
     العناصر وتُلحَق دفعةً واحدة بمِزَقٍ لا بالورقة نفسها.
     ============================================================ */
  var base=layer.getBoundingClientRect();
  var isRtl=(document.documentElement.dir!=="ltr");
  var plan=[];
  verifyResults.forEach(function(r){
    if(r.status==="ok") return;
    if(ignored[r.key]) return;
    var node=findInSheet(r.raw); if(!node) return;
    var host=node.parentNode; if(!host||!host.getBoundingClientRect) return;
    var box=host.getBoundingClientRect();
    if(!box.width && !box.height) return;
    /* البطاقةُ أعرضُ من الدائرة التي كانت، فتُزاح عن حافة الورقة
       بقدرها في جهة اليسار لئلّا تخرج عن المنظور */
    plan.push({r:r, host:host,
               top:box.top-base.top,
               side:isRtl ? box.right-base.left+10
                          : box.left-base.left-196});
  });

  var frag=document.createDocumentFragment();
  plan.forEach(function(p,i){
    var btn=document.createElement("button"); btn.className="vmark";
    /* الرقمُ للترتيب، وإلى جنبه طرفٌ من الصواب المقترح ليُعرف
       الموضعُ بلا فتح. فإن لم يكن له صوابٌ فما ورد في الوثيقة. */
    var no=document.createElement("span"); no.className="vm-no";
    no.textContent=num(i+1);
    btn.appendChild(no);
    var fx=fixFor(p.r);
    var peek=fx.correction || (p.r.near?shape(p.r.near.canonical):"") || p.r.raw || "";
    if(peek){
      var tx=document.createElement("span"); tx.className="vm-tx";
      tx.textContent=peek;
      btn.appendChild(tx);
    }
    btn.title=t("markHint");
    /* الشاهد على حافة الورقة من جهة بدء السطر، فلا يقع على الحرف */
    btn.style.top=Math.max(0,p.top)+"px";
    btn.style.left=Math.max(0,p.side)+"px";
    btn.addEventListener("click",function(e){
      e.stopPropagation();
      openMarkPop(btn,p.r);
      p.host.classList.add("flash");
      setTimeout(function(){ p.host.classList.remove("flash"); },1600);
    });
    frag.appendChild(btn);
  });
  layer.appendChild(frag);
}

/* نقرةٌ خارج اللوحة تُغلقها، كقوائم البرنامج سواء */
document.addEventListener("click",function(e){
  if(!markOpen) return;
  var el=e.target;
  if(!el || !el.closest) return;
  if(!el.closest(".vpop") && !el.closest(".vmark")) closeMarkPop();
});

/* ============================================================
   تغيّر عرضُ العمود فانساب النصّ من جديد وتبدّلت أسطره، والشواهد
   محسوبةٌ على أسطرٍ قبله. فتُعاد بعد سكون التغيير لا مع كلّ
   بكسلٍ من سحب الفاصل.
   ============================================================ */
var markMoveTimer=null;
function scheduleMarkReflow(){
  if(!$("markLayer") || !$("markLayer").firstChild) return;
  clearTimeout(markMoveTimer);
  markMoveTimer=setTimeout(renderVerifyMarks,160);
}
window.addEventListener("resize",scheduleMarkReflow);

/* ============================================================
   قائمة التدقيق.

   كل ما فيها قرآن: المحرّك لا يبني موضعاً إلا لما نُسب إلى المصحف
   (انظر worthShowing). فلا بطاقةَ «ليس من القرآن»، ولا عدّادَ يُطوى
   تحته ما لم يُعرف، ولا حالةَ showUnknown أصلاً — سقط ذلك كلّه مع
   سقوط ما ليس بقرآن من أصله.

   وما بقي ثلاثة: ما يحتاج تصحيحاً، ثم المنجَز — مصحَّحاً أو
   متجاهَلاً — تحت فاصله.
   ============================================================ */
function renderVerify(){
  var ul=$("verifyList"); if(!ul) return;
  ul.innerHTML="";
  var pending=[], settled=[];
  verifyResults.forEach(function(r){
    if(ignored[r.key])          settled.push({r:r,as:"ignored"});
    else if(r.status==="ok"){ if(fixedKeys[r.key]) settled.push({r:r,as:"fixed"}); }
    else pending.push(r);
  });

  pending.forEach(function(r){ ul.appendChild(buildCard(r,null)); });

  if(settled.length){
    var sep=document.createElement("li"); sep.className="done-sep";
    sep.textContent=t("sectionDone",{n:num(settled.length)});
    ul.appendChild(sep);
    settled.forEach(function(x){ ul.appendChild(buildCard(x.r,x.as)); });
  }
  if(!pending.length && !settled.length && verifyResults.length){
    var okli=document.createElement("li"); okli.className="hits-empty";
    okli.textContent=t("verifyClean"); ul.appendChild(okli);
  }
  /* الشواهد على الورقة وجهٌ ثانٍ لهذه القائمة نفسها، فتُبنى معها:
     ما يُتجاهَل أو يُصحَّح يسقط من الاثنين في نداءٍ واحد */
  renderVerifyMarks();
}

/* ============================================================
   ما الذي يُستبدل بماذا — مصدر واحد يستعمله زر البطاقة وزر
   «صحّح الكل» معاً، فلا يختلف سلوك الاثنين.
     target : النص الذي يُبحث عنه في الوثيقة
     sideA  : النص كما يُعرض في المقارنة
     ready  : هل هناك تصحيح يُغيّر شيئاً فعلاً
   ============================================================ */
function fixFor(r){
  /* داخل القوسين كاملاً، أو مقطع الآية بعد «قال تعالى» */
  var target = (r.kind==="brace") ? r.raw : (r.quoted||r.raw);
  var sideA  = (r.kind==="brace") ? cleanQuote(r.raw) : (r.quoted||r.raw);
  var correction = r.ref ? buildCorrection(r.ref, r.places>1) : null;
  return {target:target, sideA:sideA, correction:correction,
          ready:!!(correction && target && target!==correction)};
}
/* ============================================================
   المواضع التي ينطبق عليها التصحيح الشامل: لها مقابل في المصحف،
   ولم يتجاهلها المستخدم، وفي تصحيحها تغييرٌ فعليّ.
   أما «ليست قرآناً» فلا تُمسّ.

   ولا يُسأل هنا عن fixedKeys: كان سؤاله يستثني ما حاولنا تصحيحه
   ولو لم يستقم، فيُخفي عن الزر بقيّةَ ما يحتاج التصحيح فيقف
   وقد بقي في الوثيقة خلقٌ كثير. والقائمة تُبنى من النصّ الحاضر
   بعد كل جولة، فالمصحَّح يخرج منها بأنه صار «مطابقاً» لا بعلامةٍ
   نضعها نحن عليه.
   ============================================================ */
function pendingFixes(){
  return verifyResults.filter(function(r){
    return r.status!=="ok" && r.ref && !ignored[r.key] && fixFor(r).ready;
  });
}

/* تصحيح موضع واحد — بالموضع لا بالبحث الأعمى، كالتصحيح الشامل
   سواء، فلا يفترق سلوك الزرّين */
function applyOne(r,target,correction){
  var sp=fixSpan(src.value,r,{target:target});
  if(!sp) return false;
  lastFix[r.key]=src.value;
  fixedKeys[r.key]=1;
  src.value=src.value.slice(0,sp.at)+correction+src.value.slice(sp.at+sp.len);
  lastRendered=null; doUpdate(); persist(); runVerify();
  return true;
}

/* ============================================================
   ما لم يُعرف لا يُصحَّح آلياً، ولكن للمستخدم فيه عمل: أن يراه في
   موضعه من النصّ فيحكم فيه بنفسه — يحذف القوسين إن لم يكن آية،
   أو يصلح ما أفسده المسح الضوئي. فيُفتح تبويب النص ويُحدَّد المقطع
   بعينه، بدل أن يُترك يبحث عنه في وثيقة طويلة.
   ============================================================ */
function editInText(r){
  var at=(typeof r.start==="number" && src.value.slice(r.start,r.end)===r.raw)
           ? r.start : src.value.indexOf(r.raw);
  showTab("text");
  if(at<0) return;
  setTimeout(function(){
    src.focus();
    src.setSelectionRange(at,at+r.raw.length);
    /* التحديد وحده لا ينزل بالمنظور إلى الموضع في نصّ طويل */
    src.scrollTop=Math.max(0,(at/Math.max(1,src.value.length))*src.scrollHeight
                             - src.clientHeight/2);
  },30);
}

function buildCard(r,settledAs){
  var li=document.createElement("li");
  li.className="check-item"+(settledAs?" settled":"");

  var fix=fixFor(r);
  var target=fix.target, sideA=fix.sideA, correction=fix.correction;
  var parts = (r.ref && !settledAs) ? diffWords(sideA, correction) : null;
  var willChange = fix.ready;

  var hd=document.createElement("div"); hd.className="hd";
  var pill=document.createElement("span");
  if(settledAs==="fixed"){ pill.className="pill pill-ok"; pill.textContent=t("vFixed"); }
  else if(settledAs==="ignored"){ pill.className="pill pill-ok"; pill.textContent=t("vIgnored"); }
  else{
    /* لم يبقَ في القائمة ما ليس بقرآن، فلم يبقَ لوسم «ليس من القرآن»
       موضع. وما وُجد بأقرب آية فهو آية أفسدها المسح، ووصفُه أنه
       نصّ مقطوع أو مقحم — وهو الصدق فيه. */
    pill.className="pill pill-warn";
    pill.textContent=r.status==="warn"?t("vDiacritic"):t("vPartial");
  }
  hd.appendChild(pill);
  var ref=document.createElement("span"); ref.className="ref";
  if(r.ref) ref.textContent=r.ref.surah+" "+num(r.ref.from)+(r.ref.to!==r.ref.from?"–"+num(r.ref.to):"");
  else if(r.near) ref.textContent=t("vNear")+": "+r.near.surah+" "+num(r.near.from);
  hd.appendChild(ref);
  li.appendChild(hd);

  /* ============================================================
     المكتوب وصوابه في إطارٍ واحد: سطر الوثيقة أعلاه، والنصّ
     المضبوط تحته يفصلهما خيط. وهما مقابلةٌ واحدة لا صندوقان.
     ============================================================ */
  var pairBox=document.createElement("div"); pairBox.className="vpair";
  var qrow=document.createElement("div"); qrow.className="vrow";
  var qd=document.createElement("div"); qd.className="quote";
  if(parts) qd.innerHTML=diffHtml(parts,"a"); else qd.textContent=r.raw;
  qd.title=t("jumpHint");
  qd.addEventListener("click",function(){ jumpTo(r.raw); });
  qrow.appendChild(qd);
  pairBox.appendChild(qrow);

  if(correction && !settledAs){
    var frow=document.createElement("div"); frow.className="vrow vfix";
    var sg=document.createElement("div"); sg.className="sugg";
    var cap=document.createElement("span"); cap.className="cap";
    cap.textContent=t("suggested")+(r.ref&&r.ref.segs&&r.ref.segs.length>1?" · "+t("multiVerse",{n:num(r.ref.segs.length)}):"");
    sg.appendChild(cap);
    var b2=document.createElement("span");
    if(parts) b2.innerHTML=diffHtml(parts,"b"); else b2.textContent=correction;
    sg.appendChild(b2);
    frow.appendChild(sg); pairBox.appendChild(frow);
  }
  li.appendChild(pairBox);

  if(parts){
    var sm=diffSummary(parts);
    if(sm){ var sumEl=document.createElement("div"); sumEl.className="dsum"; sumEl.textContent=sm; li.appendChild(sumEl); }
  }

  if(correction && !settledAs){
    if(r.fn && footnotes[r.fn]){
      var fnEl=document.createElement("div"); fnEl.className="dsum"+(r.fnMismatch?" mismatch":"");
      fnEl.textContent=t("footnoteRef",{s:footnotes[r.fn].surah,a:num(footnotes[r.fn].ayah)});
      li.appendChild(fnEl);
    }
    /* المقطع المتكرّر: نصّه معلوم ورقمه مظنون، فيُنبَّه المستخدم */
    if(r.places>1){
      var amb=document.createElement("div"); amb.className="dsum mismatch";
      amb.textContent=t("manyPlaces",{n:num(r.places)+(r.places>=8?"+":"")});
      li.appendChild(amb);
    }
    /* الزر لا يظهر إن كان لن يغيّر شيئاً */
    if(!willChange){
      var hint=document.createElement("div"); hint.className="dsum"; hint.textContent=t("vNoAuto");
      li.appendChild(hint);
    }
  }

  /* ============================================================
     الآية التي أفسدها المسح حتى لم تُنسب موضعاً بعينه: عُرفت
     بأقرب آية. فتُعرض هي وتصحيحها، وللمستخدم أن يستبدلها بها
     أو يحرّرها في النصّ بيده.
     ============================================================ */
  var nearFix=null;
  if(r.status==="bad" && !settledAs && r.near){
    nearFix=shape(r.near.canonical);
    var np=diffWords(cleanQuote(r.raw),nearFix);
    /* ‏«near» تُبقيها صندوقاً على حدة: هي اقتراح موضعٍ مظنون،
       فلا تُضمّ إلى إطار المقابلة فتُقرأ كأنها الصواب المقطوع به */
    var ns=document.createElement("div"); ns.className="sugg near";
    var ncap=document.createElement("span"); ncap.className="cap";
    ncap.textContent=t("vNear")+": "+r.near.surah+" "+num(r.near.from);
    ns.appendChild(ncap);
    var nb=document.createElement("span"); nb.innerHTML=diffHtml(np,"b");
    ns.appendChild(nb); li.appendChild(ns);
  }

  var fx=document.createElement("div"); fx.className="fixrow";
  if(!settledAs && willChange){
    var ap=document.createElement("button"); ap.className="btn"; ap.textContent=t("vApply");
    ap.addEventListener("click",function(){ applyOne(r,target,correction); });
    fx.appendChild(ap);
  }
  if(nearFix){
    var nbtn=document.createElement("button"); nbtn.className="btn"; nbtn.textContent=t("vUseNear");
    nbtn.addEventListener("click",function(){ applyOne(r,r.raw,nearFix); });
    fx.appendChild(nbtn);
  }
  if(r.status==="bad" && !settledAs){
    var ed=document.createElement("button"); ed.className="btn"; ed.textContent=t("vEditText");
    ed.addEventListener("click",function(){ editInText(r); });
    fx.appendChild(ed);
  }
  if(settledAs==="fixed" && lastFix[r.key]){
    var un=document.createElement("button"); un.className="btn"; un.textContent=t("vUndoOne");
    un.addEventListener("click",function(){
      src.value=lastFix[r.key]; delete lastFix[r.key]; delete fixedKeys[r.key];
      doUpdate(); persist(); runVerify();
    });
    fx.appendChild(un);
  }
  var ig=document.createElement("button"); ig.className="btn";
  ig.textContent=settledAs==="ignored"?t("vUndoOne"):t("vIgnore");
  ig.addEventListener("click",function(){
    if(ignored[r.key]) delete ignored[r.key]; else ignored[r.key]=1;
    try{ localStorage.setItem("masih.ignored",JSON.stringify(ignored)); }catch(e){}
    renderVerify();
  });
  fx.appendChild(ig);
  li.appendChild(fx);
  return li;
}

/* ============================================================
   لا تُخزَّن نسخة من المصحف في ذاكرة المتصفح.

   كان يُكتب JSON.stringify للمصحف كلّه — نحو مليون ونصف حرف —
   في localStorage مع كل تحميل. وسقف التخزين دونه في أكثر
   المتصفحات، فيُرمى الاستثناء ويُبتلع صامتاً بعد أن يكون قد
   استُهلك في التحويل والكتابة ما استُهلك، ولا يبقى شيء محفوظ.

   والنصّ مرفق مع البرنامج ويقدّمه الخادم المحلي في اللحظة، فلا
   حاجة إلى نسخة ثانية أصلاً.
   ============================================================ */
var QURAN_KEY="masih.quran";
function setQuranReady(n){
  $("btnLoadQuran").style.display="none";
  $("btnVerify").disabled=false;
  $("btnVerify").classList.add("btn-full");
  $("quranStatus").textContent=t("quranSaved",{n:num(n)});
  $("quranStatus").className="stat ok";
}
function loadQuranData(raw){
  var data=typeof raw==="string"?JSON.parse(raw):raw;
  /* loadData يبني الفهرس ويضبطه داخل المحرّك معاً؛ فصلهما يجعل
     البحث يعمل على فهرس فارغ ويُرجع «ليست قرآناً» لكل آية. */
  quran=QE.loadData(data);
  setQuranReady(quran.length);
}
/* نصّ المصحف مرفق مع البرنامج ويقدّمه الخادم المحلي، فلا يحتاج إنترنت.
   الزر باقٍ لتحميل نسخة أخرى يدوياً عند الحاجة. */
function fetchQuran(){
  $("quranStatus").textContent=t("quranLoading"); $("quranStatus").className="stat";
  return fetch("/quran.json")
    .then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })
    .then(loadQuranData)
    .catch(function(){
      $("quranStatus").textContent=t("quranFail");
      $("quranStatus").className="stat err";
    });
}
$("btnLoadQuran").addEventListener("click",function(){
  if(quran){ $("quranPicker").click(); return; }
  fetchQuran().then(function(){ if(!quran) $("quranPicker").click(); });
});
$("quranPicker").addEventListener("change",function(e){
  var f=takeFiles(e.target)[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){ try{ loadQuranData(ev.target.result); }catch(err){
    $("quranStatus").textContent="JSON غير صالح"; $("quranStatus").className="stat err"; } };
  r.onerror=function(){ $("quranStatus").textContent=t("quranFail"); $("quranStatus").className="stat err"; };
  r.readAsText(f,"utf-8");
});
$("btnVerify").addEventListener("click",function(){ runVerify(); });
$("btnFixAll").addEventListener("click",applyAllFixes);
$("btnUndoAll").addEventListener("click",undoAllFixes);


/* الرسم العثماني يحتاج خطاً يعرفه؛ نتأكد أنه حُمِّل فعلاً */
function checkQuranFont(){
  if(!document.fonts || !document.fonts.check) return;
  document.fonts.ready.then(function(){
    var ok=false;
    ["Amiri Quran","KFGQPC Uthman Taha Naskh","KFGQPC HAFS Uthmanic Script",
     "me_quran","Scheherazade New"].forEach(function(f){
      try{ if(document.fonts.check('16px "'+f+'"')) ok=true; }catch(e){}
    });
    $("fontWarn").classList.toggle("on",!ok);
  });
}

/* ==================== الوثائق ==================== */
function syncEditorToDoc(){if(activeDoc>=0&&docs[activeDoc])docs[activeDoc].markdown=src.value;}
function renderDocs(){
  var ul=$("docList"); ul.innerHTML="";
  docs.forEach(function(d,i){
    var li=document.createElement("li"); li.className="pick"+(i===activeDoc?" active":"");
    var nm=document.createElement("span");nm.className="nm";nm.textContent=d.name;nm.title=d.name;
    var st=document.createElement("span");st.className="st";st.textContent=d.pages?t("pagesShort",{n:num(d.pages)}):"";
    var rm=document.createElement("button");rm.className="x";rm.textContent="×";
    rm.addEventListener("click",function(ev){ev.stopPropagation();removeDoc(i);});
    li.appendChild(nm);li.appendChild(st);li.appendChild(rm);
    li.addEventListener("click",function(){openDoc(i);});
    ul.appendChild(li);});
  $("docsNote").textContent=docs.length?t("docsSome"):t("docsEmpty");
  $("activeName").textContent=activeDoc>=0&&docs[activeDoc]?docs[activeDoc].name:t("noDoc");}
function openDoc(i){
  if(i===activeDoc){showTab("text");return;}
  syncEditorToDoc(); activeDoc=i; src.value=docs[i]?docs[i].markdown:"";
  undoStack=[]; resetVerifyMarks(); renderDocs(); doUpdate(); persist(); showTab("text");}
function removeDoc(i){
  if(!confirm(t("confirmRemove",{t:docs[i].name})))return;
  docs.splice(i,1);
  if(activeDoc===i){activeDoc=docs.length?0:-1;src.value=activeDoc>=0?docs[0].markdown:"";}
  else if(activeDoc>i)activeDoc--;
  undoStack=[]; renderDocs(); doUpdate(); persist();}
function addDoc(name,markdown,pages){
  syncEditorToDoc();
  docs.push({name:name,markdown:markdown,pages:pages||0});
  activeDoc=docs.length-1; src.value=markdown; undoStack=[]; resetVerifyMarks();
  renderDocs(); doUpdate(); persist();}
function downloadMd(name,text){
  var base=String(name||"doc").replace(/\.(pdf|png|jpe?g|webp|avif|md|txt)$/i,"");
  var blob=new Blob([text],{type:"text/markdown;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=base+".md";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},3000);}
$("btnSaveMd").addEventListener("click",function(){
  if(!src.value.trim()){alert(t("noText"));return;}
  syncEditorToDoc();
  var name=(activeDoc>=0?docs[activeDoc].name:"doc").replace(/\.(pdf|png|jpe?g|webp|avif|md|txt)$/i,"");
  /* الماركداون يسلك طريق التصدير نفسه: يكتبه البرنامج في مجلد
     الحفظ ويُبشَّر به، و‎downloadMd‎ ملاذٌ إن تعذّر */
  var blob=new Blob([src.value],{type:"text/markdown;charset=utf-8"});
  saveExport(blob,name,"md",function(){ downloadMd(name,src.value); });});
$("btnClear").addEventListener("click",function(){
  if(src.value&&!confirm(t("confirmClear")))return;
  undoStack.push(src.value); src.value=""; doUpdate(); persist(); src.focus();});

/* ==================== الحفظ ==================== */
var STORE="masih.v3",KEYSTORE="masih.key",PREFS="masih.prefs",persistTimer=null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer=setTimeout(function(){
    syncEditorToDoc();
    try{localStorage.setItem(STORE,JSON.stringify({docs:docs,active:activeDoc,scratch:(activeDoc<0?src.value:"")}));}catch(e){}
  },1200);}
function savePrefs(){
  try{localStorage.setItem(PREFS,JSON.stringify({
    lang:lang,theme:document.body.classList.contains("dark")?"dark":"light",
    accent:document.documentElement.style.getPropertyValue("--doc-accent").trim()||DEFAULT_ACCENT,
    font:$("fontSel").value,size:$("sizeSel").value}));}catch(e){}}
function restore(){
  try{var raw=localStorage.getItem(STORE);
    if(raw){var s=JSON.parse(raw);
      docs=Array.isArray(s.docs)?s.docs:[];
      activeDoc=(typeof s.active==="number"&&docs[s.active])?s.active:-1;
      src.value=activeDoc>=0?docs[activeDoc].markdown:(s.scratch||"");}}catch(e){}
  try{var p=JSON.parse(localStorage.getItem(PREFS)||"{}");
    setAccent(p.accent||DEFAULT_ACCENT);
    if(p.theme)setTheme(p.theme);
    if(p.font){$("fontSel").value=p.font;sheet.style.fontFamily=p.font;}
    if(p.size){$("sizeSel").value=p.size;sheet.style.fontSize=p.size;}
    if(p.lang)lang=p.lang;}catch(e){}
  /* نسخة قديمة من المصحف قد تكون بقيت من إصدار سابق: تُمسح ولا
     تُقرأ، فالخادم المحلي يقدّمه أسرع من فكّ تشفيرها */
  try{ localStorage.removeItem(QURAN_KEY); }catch(e){}
  try{var k=localStorage.getItem(KEYSTORE);if(k){apiKeyValue=k;$("rememberKey").checked=true;}}catch(e){}}

/* ==================== المودال والمظهر ==================== */
var overlay=$("overlay");
function keyReady(){return !!apiKeyValue;}
function openModal(){
  $("apiKey").value=apiKeyValue;
  loadSettings();                     /* المسار يُقرأ من الخادم عند كل فتح */
  overlay.classList.add("on");
  setTimeout(function(){$("apiKey").focus();},30);}
function closeModal(){overlay.classList.remove("on");}
/* زرّ الإعدادات صار أسفل شريط الجلسات؛ ربطه في كتلة الشريط */
$("modalClose").addEventListener("click",closeModal);
overlay.addEventListener("click",function(e){if(e.target===overlay)closeModal();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
$("modalSave").addEventListener("click",function(){
  apiKeyValue=$("apiKey").value.trim();
  try{if($("rememberKey").checked&&apiKeyValue)localStorage.setItem(KEYSTORE,apiKeyValue);
      else localStorage.removeItem(KEYSTORE);}catch(e){}
  refreshRun(); savePrefs();
  /* لا تُغلق النافذة على مسارٍ رفضه الخادم: الرسالة تحت الخانة
     وهي داخلها، فإغلاقها يُخفي الخبر ويترك المستخدم يظنّه حُفظ */
  var btn=this; btn.disabled=true;
  pushSaveDir().then(function(ok){ btn.disabled=false; if(ok) closeModal(); });});
$("modalForget").addEventListener("click",function(){
  apiKeyValue="";$("apiKey").value="";$("rememberKey").checked=false;
  try{localStorage.removeItem(KEYSTORE);}catch(e){} refreshRun();});

function setTheme(mode){

function setAccent(color){

$("themeSwitch").addEventListener("click",function(e){

/* ============================================================
   استقبال الملفات — الطريق الواحد لكل ما يدخل البرنامج.

   ثلاثة أعطاب كانت هنا، كلّها لا تظهر إلا مع أكثر من ملف:

   ١) ترتيب المكتبة كان ترتيبَ فراغ القراءة لا ترتيبَ الاختيار.
      القراءات كانت تُطلَق كلُّها معاً، فيسبق الصغيرُ الكبيرَ إلى
      النهاية. فمن استورد كتاباً مفصولاً «١ ٢ ٣» جاءته فصولُه
      مبعثرةً، ثم دمجها الزرُّ على بعثرتها. فالقراءة الآن واحدةً
      بعد واحدة، فتُحفظ رتبةُ ما اختاره.

   ٢) الملفات النصّية المُلقاة على مربّع الإفلات كانت تُرمى صامتة:
      المربّع يوقف الحدث عن النافذة ثم يسلّم كلَّ شيء إلى طابور
      المسح الضوئي، وهو لا يعرف إلا PDF والصور، فيقول «صيغ غير
      مدعومة» ويسقط ما بين يديه. فصار الفرزُ في مكان واحد يقسم
      الوارد قسمين، ويعمل من مربّع الإفلات ومن النافذة سواء.

   ٣) ما لا يُقرأ كان يختفي بلا خبر: لا onerror لقارئ الملفات،
      ولا ذكرَ للمُتخطّى في الحصيلة. فمن اختار خمسة وأُخذ اثنان
      لم يُخبَر بالثلاثة.

   وتصفير قيمة المنتقي صار قبل المعالجة لا بعدها: قيمةٌ باقية
   تعني ألّا يقع حدثُ التغيير حين يُعاد اختيار الملفات نفسها،
   فيبدو المنتقي ميّتاً.
   ============================================================ */
var TEXT_EXT=/\.(md|markdown|txt)$/i;

/* يلتقط الملفات من المنتقي ويصفّره فوراً، فلا يبقى للقيمة أثر */
function takeFiles(input){
  var list=Array.prototype.slice.call(input.files||[]);
  try{ input.value=""; }catch(e){}
  return list;
}

/* ============================================================
   قراءة متتابعة تحفظ رتبة الاختيار، وتُخبر بما تعذّر.

   والتتابع عامّ لا داخل الدفعة الواحدة فحسب: من أفلت دفعةً ثم
   أفلت أخرى قبل أن تفرغ الأولى كانت الدفعتان تتداخلان في المكتبة.
   فالقراءات كلّها في طابور واحد.
   ============================================================ */
var readChain=Promise.resolve();
function readTextFiles(list,done){
  var files=Array.prototype.slice.call(list||[]);
  readChain=readChain.then(function(){
    return new Promise(function(finish){
      var ok=0,bad=0;
      (function next(i){
        if(i>=files.length){ if(done) done(ok,bad); finish(); return; }
        var f=files[i], r=new FileReader();
        r.onload=function(ev){ addDoc(f.name,String(ev.target.result||""),0); ok++; next(i+1); };
        r.onerror=function(){ bad++; next(i+1); };
        try{ r.readAsText(f,"utf-8"); }catch(e){ bad++; next(i+1); }
      })(0);
    });
  });
}

/* ============================================================
   يقسم الوارد: نصٌّ يُوضع في الجلسة، وسواه يبقى معلَّقاً حتى
   يأذن المستخدم بالمسح.

   وكلّ وارد يفتح جلسةً جديدة: الملفّ كتابٌ قائم بذاته، فلا يُقحَم
   على ما بين يدي المستخدم من نصّ. و‎newSession‎ يحفظ الجارية قبل
   أن يُخليها، فلا يضيع شيء.

   والنصّ لا يحتاج مسحاً ضوئياً، فلا زرّ له: يُقرأ ويستقرّ في
   الجلسة مباشرة. وما سواه ينتظر ضغطةً واحدة أسفل الشاشة.
   ============================================================ */
function intake(list){
  if(ocrRunning) return false;            /* جولةٌ جارية: لا تُهدم من تحتها */
  var files=Array.prototype.slice.call(list||[]);
  if(!files.length) return false;
  var texts=files.filter(function(f){ return TEXT_EXT.test(f.name); });
  var bins =files.filter(function(f){ return !TEXT_EXT.test(f.name); });
  newSession();
  /* المعلَّق يخصّ الجلسة التي أُفلت فيها: تُفتح جلسةٌ غيرها فلا
     يبقى من سابقتها ملفٌّ ينتظر، ولا ملفٌّ فشل مسحُه فيُعاد بغير
     أن يطلبه أحد */
  queue=[];
  var q={added:0,skipped:0};
  if(bins.length) q=addToQueue(bins); else refreshRun();
  if(!texts.length){ tally_intake(q.added,q.skipped,0); return true; }
  readTextFiles(texts,function(ok,bad){ tally_intake(q.added+ok,q.skipped,bad); });
  return true;
}
function tally_intake(added,skipped,unreadable){
  if(!added && !skipped && !unreadable) return;
  var msg = added ? t("added",{n:num(added)}) : t("unsupported");
  if(added && skipped) msg += t("skipped",{n:num(skipped)});
  if(unreadable) msg += " · "+t("readFail",{n:num(unreadable)});
  setOcrStatus(msg,(skipped||unreadable)?"err":"");
}

/* ==================== OCR ==================== */
var runOcr=$("runOcr"),ocrStatus=$("ocrStatus"),extractFab=$("extractFab");
var queue=[],corsWarned=false,OK_EXT=/\.(pdf|png|jpe?g|webp|avif)$/i;
var ocrAlertShown={};

/* ============================================================
   ترجمة أخطاء خدمة المسح إلى ما يفيد المستخدم.

   ٤٠٢ يعني تحديداً: مفتاح صحيح لكن الحساب لا يملك رصيداً أو اشتراكاً
   لتشغيل هذا الطلب. وهو موضعُ لبسٍ شائع، فيظنّ المستخدم أن المفتاح
   تالف فيجدّده فيقع في المشكلة نفسها. فيُقال له صراحةً أن العلّة في
   الحساب لا في المفتاح، ويُدلّ على موضع الشحن.
   ============================================================ */
function ocrErrorMessage(code, raw){
  if(code==="402") return {
    short:"الحساب بلا رصيد",
    alertKey:"402",
    long:"رفض Mistral الطلب برمز ٤٠٢: الاشتراك أو الرصيد.\n\n"
       + "المفتاح صحيح، لكن الحساب لا يستطيع تشغيل هذا الطلب. "
       + "افتح لوحة الفوترة على console.mistral.ai/billing واشحن الحساب "
       + "أو فعّل اشتراكاً، ثم أعد المحاولة."
  };
  if(code==="401" || code==="403") return {
    short:"المفتاح مرفوض",
    alertKey:"401",
    long:"رفض Mistral المفتاح (رمز "+code+"). راجعه في ⚙ الإعدادات، "
       + "أو أنشئ مفتاحاً جديداً من console.mistral.ai/api-keys."
  };
  if(code==="429") return {
    short:"تجاوزت الحدّ — انتظر قليلاً",
    alertKey:"429",
    long:"طلبات كثيرة في فترة قصيرة (رمز ٤٢٩). انتظر دقيقة ثم أعد المحاولة."
  };
  if(code==="413" || /too large|payload/i.test(raw)) return {
    short:"الملف أكبر من الحدّ",
    alertKey:"413",
    long:"الملف أكبر مما تقبله الخدمة. جرّب تقسيمه إلى ملفات أصغر."
  };
  if(code && code[0]==="5") return {
    short:"عطل مؤقّت في الخدمة",
    alertKey:"5xx",
    long:"عطلٌ في خدمة Mistral (رمز "+code+"). انتظر قليلاً وأعد المحاولة."
  };
  return { short: raw.slice(0,40), alertKey:null, long:raw };
}
/* سطر الحال صار تحت الزرّ الطائر: هو الموضع الوحيد الذي يبقى
   ظاهراً في الوجهين — المعاينة والنصّ الخام — بعد ذهاب القسم */
function setOcrStatus(m,k){ocrStatus.textContent=m;ocrStatus.className="fab-stat"+(k?" "+k:"");}
function pendingCount(){return queue.filter(function(q){return q.status==="wait"||q.status==="err";}).length;}
/* لا يُفتح الزرّ ما دام المسح جارياً: فتحُه كان يسمح ببدء جولة
   ثانية على الملفات نفسها، فيُدفع ثمنها مرتين وتُضاف الوثيقة مرتين */
var ocrRunning=false;
/* ============================================================
   حال الزرّ الطائر — بقي الاسم كما كان فلم تتغيّر مواضع ندائه:
   يُنادى من تبديل اللغة ومن حفظ الإعدادات ومن كل تغيّرٍ في
   المعلَّق. وإنما تغيّر ما يقوده: زرٌّ أسفل الشاشة لا زرٌّ في قسم.

   ولا يظهر إلا وفي الانتظار ملفّ: فإن لم يبقَ شيء انطوى الزرّ
   ومعه سطرُ حاله، فلا يعلو على الوثيقة ما لا عمل له.
   ============================================================ */
function refreshRun(){
  var n=pendingCount();
  if(!n && !ocrRunning){ extractFab.classList.remove("on"); return; }
  extractFab.classList.add("on");
  if(ocrRunning){runOcr.disabled=true;return;}
  if(!keyReady()){runOcr.disabled=false;runOcr.textContent=t("needKey");return;}
  runOcr.disabled=false; runOcr.textContent=n>1?t("extractN",{n:num(n)}):t("extract");}
/* لا قائمةَ للمعلَّق بعد ذهاب القسم؛ وعددُه يُقال في سطر الحال
   تحت الزرّ. والاسم باقٍ فتبقى مواضع ندائه على حالها. */
function renderQueue(){
  if(ocrRunning) return;                 /* الجولة تكتب حالها بنفسها */
  var n=pendingCount();
  if(!n){ setOcrStatus("",""); return; }
  setOcrStatus(n>1?t("fabReadyN",{n:num(n)}):t("fabReady"),"");
}
/* يُرجع الحصيلة ولا يكتب الحالة: الحالة سطر واحد يجمعها بغيرها */
function addToQueue(list){
  var added=0,skipped=0;
  Array.prototype.forEach.call(list,function(f){
    if(!OK_EXT.test(f.name)){skipped++;return;}
    queue.push({file:f,status:"wait",note:""});added++;});
  refreshRun();
  return {added:added,skipped:skipped};}
function toDataUrl(file){return new Promise(function(res,rej){
  var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(new Error("read"));};r.readAsDataURL(file);});}
/* ============================================================
   تنقيةُ ما يعود من المسح من رطانة الرياضيّات.

   خدمةُ المسح تصف رقمَ الحاشية المرفوع بلغة LaTeX، فيخرج في المتن
   هكذا: ‎$^{(٥)}$‎ أو ‎${ }^{(5)}$‎ — رموزٌ لا معنى لها في وثيقةٍ
   عربية، وهي التي رآها المستخدم «أرقام مراجع بطريقة غريبة».

   فتُردّ إلى صورتها العربية: ‎(٥)‎ وحدها. ولا يُمسّ ما عداها من
   الماركداون — العناوينُ والقوائمُ والجداولُ تبقى كما جاءت.
   ============================================================ */
function tidyOcr(md){
  var s=String(md||"");
  /* ‎$^{(٥)}$‎ و‎${ }^{(٥)}$‎ و‎$^{(5)}$‎ — الرقمُ بين قوسين مرفوعاً */
  s=s.replace(/\$\{?\s*\}?\s*\^\{\s*\(([^)]{1,12})\)\s*\}\s*\$/g,"($1)");
  /* المرفوعُ بلا قوسين: ‎$^{٥}$‎ */
  s=s.replace(/\$\{?\s*\}?\s*\^\{\s*([^{}$]{1,12}?)\s*\}\s*\$/g,"($1)");
  /* المرفوعُ بحرفٍ واحد بلا أقواسٍ معقوفة: ‎$^٥$‎ */
  s=s.replace(/\$\^([^\s{}$])\$/g,"($1)");
  /* ما بقي من ‎\text{...}‎ و‎\mathrm{...}‎ يُفكّ عن محتواه.
     والأطولُ أوّلاً: ‎text‎ صدرُ ‎textit‎، فلو قُدّم لالتقط صدرَها
     وأخفق عند بقيّتها فبقيت الرطانةُ في النصّ. */
  s=s.replace(/\\(?:textit|textbf|mathrm|mathbf|text)\{([^{}]*)\}/g,"$1");
  return s.trim();
}

/* الطلب يمرّ عبر الخادم المحلي لا مباشرةً إلى Mistral: المتصفح يحجب
   الاتصال المباشر من صفحة محلية بسياسة المصادر (CORS). المفتاح يُمرَّر
   في ترويسة ولا يُسجَّل في أي مكان. */
function ocrOne(file,key){
  return toDataUrl(file).then(function(dataUrl){
    var isImage=/^data:image\//.test(dataUrl);
    return fetch("/ocr",{method:"POST",
      headers:{"Content-Type":"application/json","X-Api-Key":key},
      body:JSON.stringify({model:$("model").value,
        document:isImage?{type:"image_url",image_url:dataUrl}:{type:"document_url",document_url:dataUrl},
        include_image_base64:false})});
  }).then(function(res){
    if(!res.ok)return res.text().then(function(x){throw new Error(res.status+" "+x.slice(0,70));});
    return res.json();
  }).then(function(data){
    var pages=data.pages||[]; if(!pages.length)throw new Error("empty");
    return {markdown:pages.map(function(p){return "<!-- صفحة "+((p.index|0)+1)+" -->\n"+tidyOcr(p.markdown||"");}).join("\n\n"),count:pages.length};});}
runOcr.addEventListener("click",function(){
  if(ocrRunning)return;
  if(!keyReady()){openModal();return;}
  var pending=queue.filter(function(q){return q.status==="wait"||q.status==="err";});
  if(!pending.length)return;
  ocrRunning=true; runOcr.disabled=true;
  var okCount=0,failCount=0;
  (function next(idx){
    if(idx>=pending.length){
      ocrRunning=false;
      /* الزرّ أوّلاً ثم الخبر: ‎refreshRun‎ قد يطوي الزرّ كلَّه إن لم
         يبقَ معلَّق، والحصيلةُ تُكتب بعده فتبقى مقروءةً إن بقي */
      refreshRun();
      setOcrStatus(t("finished",{ok:num(okCount)})+(failCount?t("failedPart",{n:num(failCount)}):""),failCount?"err":"ok");
      return;}
    var q=pending[idx]; q.status="busy";q.note="";
    setOcrStatus("("+num(idx+1)+"/"+num(pending.length)+") "+q.file.name,"");
    ocrOne(q.file,apiKeyValue).then(function(r){
      addDoc(q.file.name,r.markdown,r.count);
      q.status="done";q.note=t("pagesShort",{n:num(r.count)});okCount++;
    }).catch(function(err){
      var m=String(err&&err.message||err); q.status="err";failCount++;
      if(/Failed to fetch|NetworkError|Load failed/i.test(m)){
        q.note=t("offline");
        if(!corsWarned){corsWarned=true;alert(t("offlineHint"));}
      } else {
        /* الرمز الأولُ في نصّ الخطأ رمز HTTP، يليه ردّ الخدمة. نترجم
           الشائع منه إلى رسالةٍ يفهمها المستخدم ويعرف منها ما يفعل،
           بدل أن يواجه رمزاً وسطراً إنجليزياً بلا سياق. */
        var code=(m.match(/^\d{3}/)||[""])[0];
        var msg=ocrErrorMessage(code, m);
        q.note=msg.short;
        if(msg.alertKey && !ocrAlertShown[msg.alertKey]){
          ocrAlertShown[msg.alertKey]=1; alert(msg.long);
        }
      }
    }).then(function(){next(idx+1);});
  })(0);});
/* زرّ التجاهل يُخلي المعلَّق كلّه ويطوي الزرّ الطائر معه: تراجعٌ عن
   الإفلات بلا تراجع عن الجلسة — النصّ إن كان لصق أو كُتب يبقى، وإنما
   الملفّ الذي كان ينتظر مسحاً لم يعد ينتظر شيئاً. لا يعمل والمسح
   جارٍ، كسائر ما يمسّ المعلَّق أثناء جولة. */
$("extractDismiss").addEventListener("click",function(){
  if(ocrRunning)return;
  queue=[];
  lastDropSnap=null;              /* تُجوهلت الوثيقة، فلا شيء يُتراجَع إليه */
  setOcrStatus("","");
  refreshRun();
});

/* ============================================================
   وجها الوثيقة.

   كان المفتاح في عمود الأدوات يبدّل العمودَ نفسه بين أدواته
   ونصّه، فتُقرأ الوثيقة في شريط ضيّق. وصار في شريط المعاينة
   يبدّل المعاينةَ نفسها: الورقةُ المرسومة أو نصُّها الخام،
   والأدواتُ باقيةٌ إلى جنبهما في الحالين.

   وأسماء التبويب القديمة باقية في النداء: "text" يعني النصّ
   الخام، وما سواه المعاينة.
   ============================================================ */
function showTab(name){
  var raw=(name==="text");
  document.body.classList.toggle("raw-view",raw);
  $("rawPane").classList.toggle("on",raw);
  $("viewSwitch").querySelectorAll("button").forEach(function(b){
    b.classList.toggle("on",(b.dataset.view==="raw")===raw);});
  /* لا تُقاس مواضع الشواهد والورقةُ مطويّة: مستطيلاتها كلّها أصفار.
     فتُمسح عند طيّها وتُعاد عند بسطها. */
  if(raw) clearVerifyMarks(); else renderVerifyMarks();
  if(raw)setTimeout(function(){src.focus();},0);}
$("viewSwitch").addEventListener("click",function(e){
  var b=e.target.closest("button[data-view]");
  if(b)showTab(b.dataset.view==="raw"?"text":"settings");});
/* ============================================================
   كلُّ قسمٍ يُفتح ويُطوى بنفسه وحده.

   كان فتحُ التدقيق يطوي ما سواه، بحجّة أن بطاقاته طوال فيُخلى له
   العمود. وليس ذلك للبرنامج أن يقرّره: يفتح المستخدم الاستبدال
   ثم التدقيق فيجد الأوّل قد أُغلق من غير أن يطلب. والعمود يتمرّر،
   فطولُ البطاقات لا يُلجئ إلى طيّ غيرها.
   ============================================================ */
document.querySelectorAll(".sec-head").forEach(function(h){
  h.addEventListener("click",function(){
    var sec=$(h.dataset.sec);
    sec.classList.toggle("open");
    if(sec.id==="secFind"&&sec.classList.contains("open"))findInput.focus();
    });});

/* تبدُّل الخطّ أو حجمه أو تباعده يُعيد انسياب الورقة، فتُعاد الشواهد معه */
$("fontSel").addEventListener("change",function(e){sheet.style.fontFamily=e.target.value;savePrefs();scheduleMarkReflow();});
$("sizeSel").addEventListener("change",function(e){sheet.style.fontSize=e.target.value;savePrefs();scheduleMarkReflow();});

/* الوثيقة كلّها موضعُ إفلات: لم يبقَ مربّعٌ يُقصد بعينه، فالنافذة
   بأسرها هي المقصد — يُفلت الملفّ حيث وقعت اليد فتُفتح له جلسة */
window.addEventListener("dragenter",function(e){e.preventDefault();});
window.addEventListener("dragover",function(e){e.preventDefault();});
/* ============================================================
   التراجع عن إفلاتٍ في غير موضعه.

   الإفلات يفتح جلسةً جديدة فيُخلي المحرِّر من فوره: ملفٌّ سقط من
   اليد على النافذة كان يمحو ما بين يدي المستخدم بلا بابٍ للرجوع.
   فتُلتقط صورةُ الحال قبل أن تُمَسّ، ويُعرض شريطٌ فيه «تراجع».

   والصورة تُؤخذ نسخاً لا إشارةً: ‎docs‎ و‎queue‎ مصفوفتان تُبدَّل

   ما قبله. أما عناصرهما فتُترك كما هي — لا يُنشئ الاستقبال وثيقةً
   قديمة من جديد، وإنما يُضيف إلى القائمة ويحذف منها.
   ============================================================ */

function undoDrop(snap){

  /* ============================================================
     الجلسةُ التي أنشأها الإفلات تُمحى من السجل، لا غيرُها: يُشترط
     أن يكون مؤشّرُ الجلسة قد تحوّل عمّا كان (فهي إذاً وليدةُ هذا
     الإفلات)، وأن تكون خاويةً من نصّ. وملفُّها يبقى على القرص كما
     تبقى ملفات ما يُزال من السجل — انظر forget_session.
     ============================================================ */
  var born=(curSess && (!snap.sess || curSess.id!==snap.sess.id)) ? curSess : null;

  docs=snap.docs; activeDoc=snap.active; queue=snap.queue;
  curSess=snap.sess; lastSavedText=snap.saved;
  src.value=snap.text; undoStack=[]; resetVerifyMarks();
  lastRendered=null;

  if(!born){ toast({title:t("dropUndone"),life:4000}); return; }

}
window.addEventListener("drop",function(e){

  if(!intake(files)) return;              /* رُفض الإفلات كلّه: لا شيء يُتراجَع عنه */
  /* ============================================================
     لا شريطَ عند الإفلات البتّة.

     الملفّ يظهر في الواجهة فور وقوعه، وذلك خبرُه الكافي — والشريطُ
     فوقه زيادةٌ لا تُفيد. والتراجعُ لا يضيع بذهابه: لقطةُ ما قبل
     الإفلات تبقى محفوظة، وزرُّ (×) إلى جنب «استخراج الآن» يتجاهل

});

   ملفٌّ في الحافظة (صورةُ شاشةٍ أو ملفٌّ نُسخ من المجلّد) يسلك
   طريق الإفلات نفسه: جلسةٌ جديدة، وملفٌّ معلَّق، وزرٌّ يُضغط.

   وأمّا النصّ فيُفرَّق فيه بين حالين بامتلاء المحرِّر: المحرِّر
   الخالي يعني وثيقةً تبدأ الآن، فتُفتح لها جلسة. والمحرِّر
   العامر يعني تحريراً في وثيقةٍ قائمة، فلا يُختطَف لصقُه ولا
   تُهدَم جلسةُ صاحبه على رأسه — يمرّ اللصقُ كما يمرّ في أي

  var text=cd.getData("text/plain")||"";

/* ==================== التحرير المباشر في المعاينة ==================== */
function inlineMd(node){
  var s="";
  Array.prototype.forEach.call(node.childNodes,function(c){
    if(c.nodeType===3){ s+=c.nodeValue; return; }
    var tag=c.tagName?c.tagName.toLowerCase():"";
    if(tag==="strong"||tag==="b") s+="**"+inlineMd(c)+"**";
    else if(tag==="em"||tag==="i") s+="*"+inlineMd(c)+"*";
    else if(tag==="code") s+="`"+inlineMd(c)+"`";
    else if(tag==="br") s+=" ";
    else s+=inlineMd(c);
  });
  return s;
}
function htmlToMd(root){
  var out=[];
  Array.prototype.forEach.call(root.children,function(el){
    var tag=el.tagName.toLowerCase();
    if(el.classList.contains("page-mark")){
      out.push("<!-- صفحة "+(el.dataset.page||"")+" -->"); return;
    }
    if(/^h[1-6]$/.test(tag)){
      out.push(new Array(+tag[1]+1).join("#")+" "+inlineMd(el).trim()); return;
    }
    if(tag==="p"){ out.push(inlineMd(el).trim()); return; }
    if(tag==="ul"||tag==="ol"){
      Array.prototype.forEach.call(el.children,function(li,i){
        out.push((tag==="ol"?(i+1)+". ":"- ")+inlineMd(li).trim());
      });
      out.push(""); return;
    }
    if(tag==="hr"){ out.push("---"); return; }
    if(tag==="pre"){ out.push("```\n"+el.textContent+"\n```"); return; }
    if(tag==="table"){
      var rows=[];
      Array.prototype.forEach.call(el.querySelectorAll("tr"),function(tr,ri){
        var cells=Array.prototype.map.call(tr.children,function(td){return inlineMd(td).trim();});
        rows.push("| "+cells.join(" | ")+" |");
        if(ri===0) rows.push("|"+cells.map(function(){return "---";}).join("|")+"|");
      });
      out.push(rows.join("\n")); return;
    }
    var x=inlineMd(el).trim(); if(x) out.push(x);
  });
  return out.join("\n\n").replace(/\n{3,}/g,"\n\n").trim();
}

    lastRendered=null; doUpdate(); persist();

/* ==================== تصدير Word (.docx) ====================
   يُبنى الملف كاملاً في المتصفح: أرشيف ZIP بلا ضغط + WordprocessingML.
   وورد يكتب جداول الترميز صحيحة، فيخرج النص قابلاً للنسخ والبحث،
   بخلاف الطباعة من المتصفح مع النصوص العربية.

var DOCX_TH=null;
var CRC_T=(function(){var c,t=[];for(var n=0;n<256;n++){c=n;
  for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0;} return t;})();
function crc32(u8){var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);

  files.forEach(function(f){
    var name=u8(f.name), data=u8(f.data), crc=crc32(data);
    var lh=[].concat([0x50,0x4b,0x03,0x04],n16(20),n16(0),n16(0),n16(0),n16(0),
                     n32(crc),n32(data.length),n32(data.length),n16(name.length),n16(0));
    parts.push(new Uint8Array(lh),name,data);
    central.push({name:name,crc:crc,size:data.length,off:offset});
    offset+=lh.length+name.length+data.length;
  });
  var cd=[],cdLen=0;
  central.forEach(function(c){
    var h=[].concat([0x50,0x4b,0x01,0x02],n16(20),n16(20),n16(0),n16(0),n16(0),n16(0),
                    n32(c.crc),n32(c.size),n32(c.size),n16(c.name.length),
                    n16(0),n16(0),n16(0),n16(0),n32(0),n32(c.off));
    cd.push(new Uint8Array(h),c.name); cdLen+=h.length+c.name.length;
  });

function xe(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")

function docxTheme(){
  var cs=getComputedStyle(sheet);
  var fam=(sheet.style.fontFamily||cs.fontFamily||"Traditional Arabic")
            .split(",")[0].replace(/["']/g,"").trim();
  var pt=parseFloat(sheet.style.fontSize||"13")||13;

               .trim().replace("#","").toUpperCase();

          tint:tintHex(accent,0.12)};

            + docxPara(docxRunsFrom(td,ri===0?{b:1,color:th2.accent}:{}))

/* ============================================================
   شرائط البشارة.

   لا حوارَ يُوقف العمل ولا شريطُ تنزيلٍ من المتصفّح: سطرٌ يطلع
   من أسفل الشاشة يقول ما جرى ويعرض ما يُفعل به، ثم ينصرف من
   تلقائه. وتتراكم الشرائط عموداً فلا يحجب حديثٌ حديثاً.
   ============================================================ */
function toast(opt){
  var wrap=$("toastWrap"); if(!wrap) return null;
  var box=document.createElement("div");
  box.className="toast"+(opt.kind?" "+opt.kind:"");

  var txt=document.createElement("div"); txt.className="t-txt";
  if(opt.title){ var b=document.createElement("b"); b.textContent=opt.title; txt.appendChild(b); }
  if(opt.body) txt.appendChild(document.createTextNode(opt.body));
  box.appendChild(txt);

  var done=false;
  function close(){
    if(done) return; done=true;
    clearTimeout(timer);
    if(box.parentNode) box.parentNode.removeChild(box);
  }
  (opt.actions||[]).forEach(function(a){
    var btn=document.createElement("button"); btn.className="t-act";
    btn.textContent=a.label;
    btn.addEventListener("click",function(){
      /* البند يُغلق شريطه: بقاؤه بعد الضغط يوهم أن الفعل لم يقع */
      if(a.keep!==true) close();
      if(a.run) a.run();
    });
    box.appendChild(btn);
  });
  var x=document.createElement("button"); x.className="t-x"; x.textContent="×";
  x.title=t("toastClose"); x.setAttribute("aria-label",t("toastClose"));
  x.addEventListener("click",close);
  box.appendChild(x);

  wrap.appendChild(box);
  var timer=setTimeout(close,opt.life||6000);
  return close;
}

/* ============================================================
   حفظ ملفٍّ مُصدَّر — البرنامج يكتبه بنفسه.

   وكان يُسلَّم إلى تنزيل المتصفّح: شريطٌ أسفل النافذة وسؤالٌ عن
   الإبقاء عليه، وهو مسلكُ صفحةِ وِب لا مسلكُ برنامج. فالبايتات
   تُرفَع إلى ‎/save-file‎ فيستقرّ الملفّ في مجلد الحفظ، ويُقال
   للمستخدم أين استقرّ ويُعرض عليه فتحه أو فتح مجلده.

   وإن تعذّر ذلك لأي سبب عاد الطريقُ القديم: التصدير عملُ المستخدم
   لا عملُنا، فلا يجوز أن يضيع لأن الخادم عثر.
   ============================================================ */
function blobToBase64(blob){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){
      var out=String(r.result||"");
      var at=out.indexOf(",");            /* ‎data:…;base64,‎ يُقتطع */
      res(at>=0?out.slice(at+1):out);
    };
    r.onerror=function(){ rej(new Error("read")); };
    r.readAsDataURL(blob);
  });
}
function savedToast(file,name){
  toast({title:t("savedTitle"),body:name,life:8000,actions:[
    {label:t("openFile"),run:function(){
      postJson("/open-file",{path:file}).catch(function(err){
        toast({title:t("openFail"),body:err&&err.message||"",kind:"err"});
      });
    }},
    {label:t("openFolder"),run:function(){
      postJson("/reveal",{path:file}).catch(function(){});
    }}
  ]});
}
/* fallback: نداءٌ يُنزّل الملف بالطريق القديم إن أبى الخادم */
function saveExport(blob,name,kind,fallback){
  return blobToBase64(blob).then(function(b64){
    return postJson("/save-file",{name:name,data:b64,kind:kind});
  }).then(function(d){
    savedToast(d.file,d.name||name);
  }).catch(function(err){
    if(fallback) fallback();
    toast({title:t("savedTitle"),
           body:t("saveFallback",{e:(err&&err.message)||""}),kind:"err",life:9000});
  });
}
/* التنزيل بالطريق القديم — باقٍ ليكون ملاذاً حين يتعذّر الحفظ */
function downloadBlob(blob,filename){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
}

/* ==================== زر PDF ====================
   الورقة تُرسَل إلى البرنامج نفسه فيبنيها بـ fpdf2، فيخرج ملف
   مطابق للمعاينة ونصّه حروف حقيقية قابلة للنسخ والبحث —
   بخلاف طباعة المتصفح التي تُخرج نصاً عربياً مشوّهاً عند نسخه.
   ================================================ */
function saveViaBuilder(){
  var built=buildPrintHtml();
  if(!built) return;
  var btn=$("btnPrint"), label=btn.textContent;
  btn.disabled=true; btn.textContent=t("pdfBuilding");
  fetch("/pdf",{method:"POST",headers:{"Content-Type":"text/html;charset=utf-8"},body:built.html})
    .then(function(r){
      if(r.ok) return r.blob();
      /* الخادم يشرح سبب الفشل في جسم الرد؛ نعرضه كما هو */
      return r.text().then(function(txt){
        var why=txt;
        try{ why=JSON.parse(txt).error||txt; }catch(e){}
        var err=new Error("build"); err.detail=why; throw err;
      });
    })
    .then(function(blob){
      /* البناء تمّ، فالتسليم إلى البرنامج لا إلى تنزيل المتصفّح */
      return saveExport(blob,built.name,"pdf",function(){
        downloadBlob(blob,built.name+".pdf");
      });
    })
    .then(function(){
      btn.textContent=t("pdfDone");
      setTimeout(function(){ btn.textContent=label; btn.disabled=false; },1800);
    })
    .catch(function(err){
      btn.textContent=label; btn.disabled=false;
      alert(err && err.message==="build"
        ? t("pdfBuildFail",{e:err.detail||""})
        : t("pdfNoBuilder"));
    });
}

/* ============================================================
   السجل — جلسة لكل كتاب.

   المكتبة أعلاه ذاكرةُ الجلسة الحاضرة: ما استُخرج الآن، محفوظاً في
   مخزن الصفحة. والسجل غيرها: كل كتاب فرغتَ منه يصير ملفَّ md على
   القرص يكتبه البرنامج، فيبقى بعد إغلاق النافذة وبعد تحديث البرنامج،
   وتفتحه بأي محرّر شئت.

   والحفظ يمرّ بالخادم لأن الصفحة لا تكتب في القرص. فإن لم يكن في
   الخادم هذه المسارات — نسخة أقدم — قيل ذلك ولم يُفقد نصّ.
   ============================================================ */
var sessions=[], curSess=null, sessReady=true;

function jsonReq(path,opt){
  return fetch(path,opt).then(function(r){
    return r.text().then(function(txt){
      var data=null; try{ data=txt?JSON.parse(txt):null; }catch(e){}
      if(!r.ok){
        var err=new Error((data&&data.error)||("HTTP "+r.status));
        err.status=r.status; throw err;
      }
      return data;
    });
  });
}
function postJson(path,body){
  return jsonReq(path,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)});
}
/* ============================================================
   شريط الجلسات — كمحادثات الذكاء الاصطناعي.

   كلّ كتابٍ يُستخرَج أو نصٍّ يُكتب يصير جلسةً باسمٍ افتراضيّ «بلا عنوان»
   حتى يسمّيها المستخدم، وتُحفَظ تلقائياً في مسار الحفظ من الإعدادات.
   لا زرّ حفظٍ يدويّ: الكتابة تحفظ، والقائمة على اليسار تعرض الكلّ.
   ============================================================ */
function stamp(iso){
  if(!iso) return "";
  var d=new Date(iso); if(isNaN(d.getTime())) return "";
  var loc=lang==="ar"?"ar-EG":"en-GB";
  try{
    return d.toLocaleDateString(loc,{year:"numeric",month:"short",day:"numeric"})
         +" · "+d.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"});
  }catch(e){ return iso.slice(0,16).replace("T"," "); }
}
function sideDown(err){
  sessReady=false;
  $("sideList").innerHTML="";
  var e=$("sideEmpty"); e.style.display="block"; e.textContent=t("sessOff");
}

/* ما لم يُسمِّه المستخدم يبقى «بلا عنوان» */
function sessName(s){ return (s && s.title && s.title.trim()) ? s.title : t("untitled"); }

function renderSideList(){
  var ul=$("sideList"); if(!ul) return;
  ul.innerHTML="";
  var empty=$("sideEmpty");
  if(!sessReady){ empty.style.display="block"; empty.textContent=t("sessOff"); return; }
  empty.style.display=sessions.length?"none":"block";
  empty.textContent=t("sideEmpty");
  sessions.forEach(function(s){
    var li=document.createElement("li");
    if(curSess && curSess.id===s.id) li.className="cur";
    /* ============================================================
       الجلسةُ التي ذهب ملفّها تُعرف من القائمة نفسها.

       الخادم لا يحذفها من الفهرس إن غاب ملفّها — والملفّ ملك المستخدم
       وقد يكون نقله لا حذفه — بل يَسِمها ‎missing‎. وكانت القائمة تُهمل
       هذه السمة، فتُعرض الجلسةُ كأنّ ملفّها قائم: يحذف المستخدم الـ md
       فيراها باقيةً لا يدري ما بها، فإن ضغطها جاءه عطلٌ فجأة.

       فتُعرَض الآن باهتةً مشطوبةً وإلى جنبها سببُها، وفي تلميحها كيف
       تُرفع من السجل. ولا تُحذف من تلقائنا: ذلك قرارُ صاحبها.
       ============================================================ */
    if(s.missing) li.className+=(li.className?" ":"")+"gone";
    li.title=sessName(s)+(s.file?("\n"+s.file):"")
             +(s.missing?("\n\n"+t("sessGoneTip")):"");
    var nm=document.createElement("span"); nm.className="nm"; nm.textContent=sessName(s);
    li.appendChild(nm);
    if(s.missing){
      var gone=document.createElement("span"); gone.className="gone-tag";
      gone.textContent=t("sessGone");
      li.appendChild(gone);
    }
    var mm=document.createElement("button"); mm.className="mm"; mm.textContent="⋯";
    mm.setAttribute("aria-label","⋯");
    mm.addEventListener("click",function(ev){ ev.stopPropagation(); openMenu(s,mm); });
    li.appendChild(mm);
    li.addEventListener("click",function(){ if(!curSess||curSess.id!==s.id) openSession(s); });
    li.addEventListener("dblclick",function(){ beginRename(s,li,nm); });
    ul.appendChild(li);
  });
}

function loadSessions(){
  return jsonReq("/sessions").then(function(d){
    sessReady=true;
    sessions=(d&&d.sessions)||[];
    renderSideList();
  }).catch(function(err){ if(!err||err.status!==404) sideDown(err); else { sessReady=true; sessions=[]; renderSideList(); } });
}

/* ============================================================
   السجلّ يُراجَع عند العودة إلى النافذة.

   ملفّات الـ md على القرص، والمستخدم يحذفها ويَنقلها من خارج
   البرنامج. وكانت القائمة لا تُقرأ إلا عند الإقلاع أو بعد حفظ،
   فيحذف الملفّ ثمّ يعود فيرى جلستَه قائمةً كأن شيئاً لم يكن.

   فتُعاد قراءتُها كلّما رجع إلى النافذة: هي طلبٌ واحدٌ خفيف، ولا
   يقع إلّا عند رجوعه، ولا يُطلب والنافذةُ محجوبة.
   ============================================================ */
window.addEventListener("focus",function(){
  if(sessReady) loadSessions();
});

/* ============================================================
   الحفظ التلقائيّ.

   يُؤجَّل بعد كلّ تغيير ثانيةً ونصفاً، فلا يُرهق الخادمَ بكلّ حرف.
   ولا يُحفظ نصٌّ فارغ، ولا يُنشأ جلسةٌ خاوية. وأوّلُ حفظٍ لجلسةٍ
   جديدة يُنشئها باسم «بلا عنوان»، وما بعده يحدّثها بمعرّفها.
   ============================================================ */
var autosaveTimer=null, savingNow=false, dirtyAgain=false, lastSavedText=null;
function scheduleAutosave(){
  if(!sessReady) return;
  clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(autosave,1500);
}
function autosave(){
  if(!sessReady) return;
  syncEditorToDoc();
  var text=src.value;
  if(!text.trim()) return;                 /* لا نُنشئ جلسةً خاوية */
  if(curSess && text===lastSavedText) return;
  if(savingNow){ dirtyAgain=true; return; }
  savingNow=true; setSideSaving(true);
  var body={ title: curSess?curSess.title:t("untitled"), markdown:text,
             pages:(activeDoc>=0&&docs[activeDoc]?docs[activeDoc].pages||0:0) };
  if(curSess) body.id=curSess.id;
  postJson("/sessions",body).then(function(s){
    /* لا نتبنّى الجلسة المحفوظة إلا إن كان المحرِّر ما زال يعرض نصّها:
       لو ضغط المستخدم «جلسة جديدة» أثناء الحفظ، صار على وثيقةٍ أخرى،
       فلا يصحّ أن نُعيد المؤشّر إلى القديمة. */
    if(src.value===text){ curSess={id:s.id,title:s.title,file:s.file}; lastSavedText=text; }
    return loadSessions();
  }).catch(function(err){
    if(err && err.status===404) sideDown(err);
    /* غير ذلك: النصّ باقٍ، والحفظ يُعاد في الجولة التالية */
  }).then(function(){
    savingNow=false; setSideSaving(false);
    if(dirtyAgain){ dirtyAgain=false; scheduleAutosave(); }
  });
}
function setSideSaving(on){
  var e=$("sideEmpty");
  /* مؤشّر خفيّ: لا نُقحم شريطَ حالةٍ دائم، يكفي أن نُظهر الحفظ في العنوان */
  document.title = on ? "…" : "ماسح";
}

/* جلسة جديدة: نحفظ الحالية (إن كانت)، ثم نُخلي المحرِّر لبداية نظيفة */
function newSession(){
  if(!sessReady) return;
  clearTimeout(autosaveTimer);
  if(src.value.trim() && (!curSess || src.value!==lastSavedText)){
    /* احفظ ما بيد المستخدم قبل أن نُخليه */
    autosave();
  }
  curSess=null; lastSavedText=null;
  if(activeDoc>=0){ syncEditorToDoc(); }
  src.value=""; undoStack=[]; resetVerifyMarks();
  lastRendered=null; doUpdate(); persistBase();
  renderSideList(); showTab("text"); src.focus();
}

function openSession(s){
  clearTimeout(autosaveTimer);
  jsonReq("/sessions/"+encodeURIComponent(s.id)).then(function(d){
    if(d && d.missing){ alert(d.error||t("sessFail",{e:"?"})); return; }
    syncEditorToDoc();
    src.value=d.markdown||""; undoStack=[]; resetVerifyMarks();
    lastRendered=null; doUpdate(); persistBase();
    curSess={id:d.id,title:d.title,file:d.file};
    lastSavedText=d.markdown||"";
    renderSideList(); showTab("text");
  }).catch(function(err){ alert(t("sessFail",{e:err.message})); });
}
function revealSession(s){
  if(!s.file) return;
  postJson("/reveal",{path:s.file}).catch(function(){});
}
function dropSession(s){
  if(!confirm(t("sessDropAsk",{t:sessName(s)}))) return;
  jsonReq("/sessions/"+encodeURIComponent(s.id),{method:"DELETE"}).then(function(){
    if(curSess && curSess.id===s.id){ curSess=null; lastSavedText=null; }
    return loadSessions();
  }).catch(function(err){ alert(t("sessFail",{e:err.message})); });
}

/* إعادة التسمية داخل السطر نفسه */
function beginRename(s,li,nm){
  var inp=document.createElement("input");
  inp.className="rename-inp"; inp.value=sessName(s);
  li.insertBefore(inp,nm); nm.style.display="none";
  inp.focus(); inp.select();
  var done=false;
  function finish(commit){
    if(done) return; done=true;
    var v=inp.value.trim();
    inp.remove(); nm.style.display="";
    if(commit && v && v!==sessName(s)) commitRename(s,v);
  }
  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ e.preventDefault(); finish(true); }
    else if(e.key==="Escape"){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener("blur",function(){ finish(true); });
}
function commitRename(s,title){
  /* الخادم يكتب النصّ مع كل حفظ، فلا بدّ أن نُعيده معه لئلّا يُمحى.
     إن كانت الجلسة هي المفتوحة أخذنا النصّ من المحرّر، وإلا قرأناه. */
  function push(markdown,pages){
    return postJson("/sessions",{id:s.id,title:title,markdown:markdown,pages:pages||0})
      .then(function(){
        if(curSess && curSess.id===s.id) curSess.title=title;
        return loadSessions();
      });
  }
  if(curSess && curSess.id===s.id){
    syncEditorToDoc();
    push(src.value,s.pages).catch(function(err){ alert(t("sessFail",{e:err.message})); });
  } else {
    jsonReq("/sessions/"+encodeURIComponent(s.id)).then(function(d){
      return push(d.markdown||"",d.pages||s.pages);
    }).catch(function(err){ alert(t("sessFail",{e:err.message})); });
  }
}

/* ============================================================
   قائمة السطر (⋯): إعادة تسمية · المجلّد · إزالة
   ============================================================ */
var menuFor=null;
function openMenu(s,anchor){
  menuFor=s;
  var m=$("sideMenu"); var r=anchor.getBoundingClientRect();
  m.style.top=(r.bottom+4)+"px";
  /* في RTL نفتحها إلى يسار الزرّ لئلّا تخرج عن الشاشة */
  m.style.left=Math.max(8,r.left-140)+"px";
  m.classList.add("on");
}
function closeMenu(){ $("sideMenu").classList.remove("on"); menuFor=null; }
$("sideMenu").addEventListener("click",function(e){
  var b=e.target.closest("button[data-act]"); if(!b||!menuFor) return;
  var s=menuFor, act=b.dataset.act; closeMenu();
  if(act==="rename"){
    var target=null;
    Array.prototype.forEach.call($("sideList").children,function(x){
      var nm=x.querySelector(".nm"); if(nm && nm.textContent===sessName(s)) target=x; });
    if(target) beginRename(s,target,target.querySelector(".nm"));
  } else if(act==="reveal") revealSession(s);
  else if(act==="delete") dropSession(s);
});
document.addEventListener("click",function(e){
  if($("sideMenu").classList.contains("on") && !e.target.closest("#sideMenu")) closeMenu();
});
